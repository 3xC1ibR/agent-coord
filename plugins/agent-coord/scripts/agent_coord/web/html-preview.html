<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HTML preview — Ribbon Field</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/html-preview.css">
  <script src="/html-preview.js" defer></script>
</head>
<body class="html-preview-page">
  <header class="html-preview-header">
    <button id="preview-back" class="quiet" type="button">Back to conversation</button>
    <h1 id="preview-title">HTML preview</h1>
  </header>
  <main class="html-preview-content">
    <p id="preview-status" role="status">Loading preview…</p>
    <button id="preview-retry" type="button" hidden>Try again</button>
    <iframe id="preview-frame" title="HTML preview" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
  </main>
</body>
</html>
