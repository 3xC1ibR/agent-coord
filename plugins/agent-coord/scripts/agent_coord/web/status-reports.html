<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <title>Status — Ribbon Field</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/status-reports.css">
  <script src="/status-reports.js" defer></script>
</head>
<body class="status-reports-page">
  <header class="status-reports-header">
    <div><h1>Status</h1><p>Reports from all agents and projects.</p></div>
    <button id="close-status-reports" type="button" class="quiet">Done</button>
  </header>
  <main class="status-reports-content">
    <div class="status-reports-toolbar">
      <label>Show<select id="status-report-view"><option value="inbox">Inbox</option><option value="dismissed">Dismissed</option><option value="all">All reports</option></select></label>
      <label>Project<select id="status-report-workspace"><option value="">All projects</option></select></label>
      <label class="status-report-search">Search<input id="status-report-search" type="search" placeholder="Title, agent, project, or provider"></label>
      <button id="refresh-status-reports" type="button" class="quiet">Refresh</button>
    </div>
    <p id="status-report-error" role="alert" hidden></p>
    <p id="status-report-coverage" class="status-report-note" hidden></p>
    <div class="status-report-feedback"><span id="status-report-counts"></span><span id="status-report-feedback" role="status">Loading reports…</span><button id="undo-status-report" type="button" class="quiet" hidden>Undo</button></div>
    <div id="status-report-layout" class="status-report-layout">
      <section class="status-report-index" aria-label="Generated status reports">
        <p id="status-report-empty" class="status-report-empty" hidden></p>
        <ul id="status-report-list" class="status-report-list"></ul>
      </section>
      <section id="status-report-reader" class="status-report-reader" aria-labelledby="status-report-title" hidden>
        <div class="status-report-reader-heading"><div><h2 id="status-report-title"></h2><p id="status-report-origin" class="status-report-note"></p></div><div class="status-report-reader-actions"><button id="dismiss-selected-status-report" type="button" class="quiet">Dismiss</button><button id="close-status-report" type="button" class="quiet">Close report</button></div></div>
        <p id="status-report-reader-error" role="alert" hidden></p>
        <iframe id="status-report-frame" title="Selected status report" sandbox="" referrerpolicy="no-referrer"></iframe>
      </section>
    </div>
  </main>
</body>
</html>
