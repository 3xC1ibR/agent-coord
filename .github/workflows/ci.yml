name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the CLI's minimum Python and the desktop runtime's minor version.
          - os: ubuntu-24.04
            python: '3.10'
          - os: macos-15
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ripgrep
      - name: Validate plugin packaging
        run: python3 scripts/plugin_tools.py validate
      - name: Install frontend build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build content-addressed frontend assets
        run: python3 scripts/build_web.py
      - name: Verify canonical interface tokens
        run: python3 scripts/check_design_tokens.py
      - name: Install the native Codex hook regression client
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-hook-client" --no-audit --no-fund @openai/codex@0.171.0
          echo "$RUNNER_TEMP/codex-hook-client/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Compile Python sources
        run: python3 -m compileall -q plugins/agent-coord/scripts scripts tests desktop/macos
      - name: Run JavaScript tests
        run: node --test tests/*.js
      - name: Verify isolated OpenUI rendering in WebKit
        if: runner.os == 'macOS'
        run: |
          python3 desktop/macos/openui_smoke.py
          python3 desktop/macos/openui_smoke.py --portfolio
      - name: Run Python tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Verify database latency and writer admission
        run: python3 scripts/measure_database_contention.py --seconds 15 --writers 6 --check --output build/database-performance.json
      - name: Retain database performance measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-performance-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/database-performance.json
          if-no-files-found: ignore
          retention-days: 30

  interface-acceptance:
    name: Interface states and interaction latency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install frontend and browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix demo --ignore-scripts --omit=dev --no-audit --no-fund
          demo/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and verify the interface
        run: |
          python3 scripts/build_web.py
          python3 scripts/check_design_tokens.py
      - name: Verify durable composer drafts
        run: RIBBON_BROWSER=chromium node --test tests/test_composer_drafts.mjs
      - name: Verify interface states and interaction latency
        run: |
          node scripts/validate_interface.mjs --source "$PWD" \
            --output "$RUNNER_TEMP/interface-acceptance" --check
      - name: Retain interface measurements and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interface-acceptance
          path: ${{ runner.temp }}/interface-acceptance
          if-no-files-found: ignore
          retention-days: 30

  ios-companion:
    name: iOS companion policy and simulator build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify connection and pairing policies
        run: swift test --package-path mobile/ios
      - name: Build the iOS companion for the simulator
        run: |
          xcodebuild -project mobile/ios/RibbonField.xcodeproj \
            -scheme RibbonField -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Retain the simulator application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator
          path: build/ios-simulator/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 30

  macos-build:
    name: macOS standalone build (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Set up Node.js for frontend packaging
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install frontend build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build content-addressed frontend assets
        run: python3 scripts/build_web.py
      - name: Verify canonical interface tokens
        run: python3 scripts/check_design_tokens.py
      # Ad hoc signing exercises packaging without release credentials or notarization.
      - name: Build standalone test disk image
        run: |
          python3 desktop/macos/build.py --standalone --arch arm64 \
            --output 'build/ci/Ribbon Field.app' \
            --dmg build/ci/Ribbon-Field-arm64-test.dmg
      # The headless check relocates the app and runs its bundled runtime/backend/CLI.
      # Foreground native UI smoke tests remain a release check on an unlocked Mac.
      - name: Verify disk image and relocated app
        run: |
          python3 desktop/macos/verify_distribution.py \
            --dmg build/ci/Ribbon-Field-arm64-test.dmg \
            --report build/ci/distribution-validation.json
      - name: Build the separate native smoke harness
        run: |
          python3 desktop/macos/build.py --standalone --arch arm64 --smoke-harness \
            --output 'build/ci-smoke/Ribbon Field.app'
      - name: Verify native window origins across a backend change
        run: |
          python3 desktop/macos/smoke_test.py --origins-only \
            --app 'build/ci-smoke/Ribbon Field.app' --report build/ci/native-window-origins.json
      - name: Verify retained windows and drafts across relaunches
        run: |
          python3 desktop/macos/window_restore_test.py \
            --app 'build/ci-smoke/Ribbon Field.app' \
            --report build/ci/window-restoration/summary.json
      - name: Install the workload browser
        run: |
          npm ci --prefix demo --ignore-scripts --omit=dev
          demo/node_modules/.bin/playwright install chromium
      - name: Verify durable composer drafts
        run: RIBBON_BROWSER=chromium node --test tests/test_composer_drafts.mjs
      - name: Measure packaged conversations under streaming load
        run: |
          python3 scripts/measure_packaged_conversation_workload.py \
            --app 'build/ci/Ribbon Field.app' --report build/ci/generated-conversation-workload.json
      - name: Retain generated workload measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-conversation-workload
          path: |
            build/ci/generated-conversation-workload.json
            build/ci/native-window-origins.json
            build/ci/window-restoration
            build/ci/generated-conversation-workload.sample.txt
          retention-days: 30
