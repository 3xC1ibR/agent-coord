<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 18 · Atlas</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* One canvas with one coordinate system. The camera zooms through three levels: all domains,
       one domain as a scatter, one orchestrator with its sub-agents. Size is how much you have
       talked to an agent; color is how recently it did anything; a ring is its state. */
    html, body { height: 100%; } body { height: 100dvh; overflow: hidden; }
    #stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); overflow: hidden; }
    #stage[data-panel="bottom"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 190px; }
    .canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }

    svg.atlas.dragging { cursor: grabbing; }

    .blob:hover { fill: color-mix(in srgb, var(--ink) 7%, var(--paper)); stroke: color-mix(in srgb, var(--ink) 30%, transparent); }
    .cluster.focused .blob { fill: color-mix(in srgb, var(--surface) 70%, var(--paper)); stroke: color-mix(in srgb, var(--ink) 22%, transparent); cursor: default; }
    .cluster.dim .blob { opacity: .22; stroke: color-mix(in srgb, var(--ink) 10%, transparent) !important; }
    .cluster.dim text { opacity: .35; }
    .cluster.needs:not(.focused) .blob { stroke: color-mix(in srgb, var(--warm) 55%, transparent); }
    .cluster-label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); letter-spacing: -.01em; pointer-events: none; }
    .cluster-sub { font: 10px var(--mono); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
    .cluster-count { font: 600 11px var(--mono); fill: var(--muted); pointer-events: none; }
    .cluster-needs { font: 600 10px var(--mono); fill: var(--warm); pointer-events: none; }
    .spoke, .tie, .node circle, .sub circle { vector-effect: non-scaling-stroke; }
    .node { cursor: pointer; }
    .node.faded { opacity: .35; }
    .node circle.core { stroke: var(--paper); stroke-width: 1.2; }
    .node circle.state { fill: none; stroke-width: 2.2; display: none; }
    .node.waiting circle.state { display: block; stroke: var(--warm); animation: blink 1.3s steps(2, start) infinite; }
    .node.failed circle.state { display: block; stroke: var(--danger); animation: blink 1.3s steps(2, start) infinite; }
    .node.blocked circle.state { display: block; stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1.4; }
    .node.done circle.state { display: block; stroke: var(--ok); stroke-width: 1.4; opacity: .7; }
    .node.working circle.halo { fill: var(--accent); opacity: .16; animation: breathe 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node.pinned circle.ring { fill: none; stroke: var(--line-strong); stroke-width: .8; }
    .node circle.mark { fill: none; stroke: var(--ink); stroke-width: 1.4; display: none; }
    .node.highlight circle.mark { display: block; animation: locate 1.6s ease-out 3; transform-box: fill-box; transform-origin: center; }
    .node.peeked circle.mark { display: block; }
    .spoke { stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: .8; }
    .sub circle.core { stroke: var(--paper); stroke-width: .8; cursor: pointer; }
    .sub circle.state { fill: none; stroke-width: 1.8; display: none; }
    .sub.waiting circle.state, .sub.failed circle.state { display: block; stroke: var(--warm); animation: blink 1.3s steps(2, start) infinite; }
    .sub.blocked circle.state { display: block; stroke: var(--muted); stroke-dasharray: 2 2; stroke-width: 1.2; }

    .sub circle.mark { fill: none; stroke: var(--ink); stroke-width: 1.2; display: none; }
    .sub.highlight circle.mark { display: block; animation: locate 1.6s ease-out 3; transform-box: fill-box; transform-origin: center; }
    .sub-count { font: 600 7px var(--mono); fill: var(--muted); pointer-events: none; }
    .node-label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); pointer-events: none; }
    .node-label.hub-label { font-weight: 600; }
    .node-doing { font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); pointer-events: none; }
    .node.working .node-doing, .sub.working .node-doing { fill: var(--accent); }

    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .legend .swatches { display: inline-flex; gap: 2px; }
    .legend .swatches i { width: 7px; height: 7px; }
    .legend .ring { border: 2px solid var(--warm); background: transparent; }
    .controls { position: absolute; z-index: 3; right: 14px; bottom: 12px; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
    .controls select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 11px; }
    .panel { min-width: 0; min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
    #stage[data-panel="bottom"] .panel { border-left: 0; border-top: 1px solid var(--line); flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .panel-head { flex: none; padding: 12px 16px 8px; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .panel-head i { width: 6px; height: 6px; border-radius: 50%; background: var(--warm); }
    #stage[data-panel="bottom"] .panel-head { writing-mode: vertical-rl; transform: rotate(180deg); padding: 10px 6px; border-left: 1px solid var(--line); }
    .ask-item { display: grid; gap: 4px; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .ask-item:hover { background: var(--hover-bg); }
    .ask-item.located { background: color-mix(in srgb, var(--warm-tint) 60%, var(--surface)); }
    #stage[data-panel="bottom"] .ask-item { flex: 0 0 300px; border-bottom: 0; border-right: 1px solid var(--line); }
    .ask-item .top { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; }
    .ask-item .top .kind { font: 600 8.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--warm); }
    .ask-item .top b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ask-item .top small { color: var(--muted); font-size: 10px; white-space: nowrap; margin-left: auto; }
    .ask-item .from { font-size: 10px; color: var(--muted); }
    .ask-item .q { font-size: 11.5px; line-height: 1.45; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ask-item .act { display: flex; gap: 5px; align-items: center; margin-top: 2px; }
    .ask-item .act .btn { padding: 3px 9px; font-size: 11px; }
    .ask-item .act .locate { margin-left: auto; font-size: 10px; color: var(--muted); }
    .panel .calm { padding: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    @keyframes blink { 50% { opacity: .3; } }
    @keyframes breathe { 50% { transform: scale(1.5); opacity: .07; } }
    @keyframes locate { 0% { transform: scale(2.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .node circle.halo, .node circle.state, .sub circle.state { animation: none !important; } }
  </style>

<main id="stage"></main>

<script>
"use strict";

  const state = {level: 0, focus: null, hub: null, view: null, anim: null, hovered: null, highlight: null, panel: "right", labels: "auto", targetScale: null};
  let canvas, svg, panel, toolbar, controls, legend, clusters = new Map(), nodeEls = new Map(), api, currentField = null, drawnScale = 1;
  const W = () => canvas.clientWidth || 1000, H = () => canvas.clientHeight || 700;
  const viewScale = () => W() / (state.view?.w || 1600);

  // Encodings. Size: messages from the user. Color: age. Ring: state (in CSS).
  const ageMix = (field, a) => Math.round(100 - 80 * Math.min(1, Math.log1p(field.age(a) / MIN) / Math.log1p(24 * 60)));

  const sizeFor = (a, far) => far ? Math.min(8, 2.6 + 1.3 * Math.sqrt(a.userTurns || 0)) : Math.min(15, 4 + 2.6 * Math.sqrt(a.userTurns || 0));

  /* ---------- Clusters ---------- */

    const odd = c => c.members.length === 1 && c.key !== "∅" && !c.key.includes("/") && !AgentField.DOMAINS.includes(c.key) && scenario !== "none";
