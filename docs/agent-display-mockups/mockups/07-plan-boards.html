<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 07 · Plan boards</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* Every root agent is a board column of its own plan steps; the top rolls the whole field up. */
    .rollup { display: grid; gap: 12px; margin-bottom: 22px; }
    .rollup-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 34px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat b { font-size: 24px; font-weight: 550; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat b small { font-size: 14px; font-weight: 450; color: var(--muted); }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat.warm b { color: var(--warm); }
    .stat.accent b { color: var(--accent); }
    .view-toggle { margin-left: auto; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 7px; }
    .view-toggle .btn { border-color: transparent; background: transparent; padding: 5px 10px; }
    .view-toggle .btn[aria-pressed="true"] { background: var(--tint); border-color: transparent; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 9px; height: 9px; border-radius: 2px; }
    .legend b { color: var(--ink); font-weight: 550; font-variant-numeric: tabular-nums; }

    /* Stacked step bar: done, active, delegated, blocked, to do. */
    .segbar { display: flex; gap: 1px; height: 4px; border-radius: 2px; overflow: hidden; flex: 1; min-width: 36px; }
    .segbar i, .legend i { display: block; min-width: 3px; background: var(--line-strong); }
    .segbar i.done, .legend i.done { background: var(--ok); }
    .segbar i.active, .legend i.active { background: var(--accent); }
    .segbar i.delegated, .legend i.delegated { background: color-mix(in srgb, var(--accent) 40%, var(--line-strong)); }
    .segbar i.blocked, .legend i.blocked { background: var(--warm); }
    .segbar i.empty { flex: 1; background: var(--line); }
    .segbar.big { height: 10px; border-radius: 5px; gap: 2px; }
    .segbar.mini { flex: none; width: 40px; min-width: 0; height: 3px; }

    /* Columns view */
    .board { display: grid; grid-auto-flow: column; gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 10px; }
    .col { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .col.needs { border-top: 2px solid var(--warm); }
    .col.working { border-top: 2px solid var(--accent); }
    .col.done { background: color-mix(in srgb, var(--surface) 60%, var(--paper)); }
    .col-head { display: grid; gap: 7px; padding: 12px 14px 11px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px 8px 0 0; }
    .col-head:hover { background: var(--hover-bg); }
    .col-head h3, .board-card h3 { font-size: 14px; font-weight: 550; letter-spacing: -.02em; line-height: 1.35; }
    .identity { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 10px; color: var(--muted); }
    .identity .provider-logo { width: 13px; height: 13px; }
    .identity .role { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .identity .when { margin-left: auto; font-family: var(--mono); white-space: nowrap; }
    .identity .btn { padding: 1px 6px; font-size: 10px; }
    .state { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; font-size: 11px; color: var(--muted); }
    .state .label { color: var(--ink); }
    .state.working .label { color: var(--accent); }
    .state.waiting .label { color: var(--warm); }
    .state.failed .label { color: var(--danger); }
    .progress { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .kofn { font: 10.5px var(--mono); color: var(--ink); white-space: nowrap; }
    .kofn small { color: var(--muted); font-size: inherit; }
    .needs-badge { flex: none; font: 600 9.5px var(--mono); color: var(--warm); background: var(--warm-tint); border: 1px solid color-mix(in srgb, var(--warm) 45%, transparent); border-radius: 9px; padding: 1px 7px; white-space: nowrap; }
    .subtree { font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .subtree .dots { display: inline-flex; flex: none; gap: 3px; }
    .subtree .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board-card .child-ask { padding: 6px 6px 6px 0; margin: -2px 0 -2px; border-radius: 6px; cursor: pointer; }
    .board-card .child-ask:hover { background: var(--warm-tint); }

    .steps { display: flex; flex-direction: column; gap: 1px; padding: 6px; }
    .step { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 12px; line-height: 1.45; cursor: pointer; }
    .step:hover { background: var(--hover-bg); }
    .step.static { cursor: inherit; padding: 0; }
    .step.static:hover { background: none; }
    .mark { position: relative; width: 14px; height: 14px; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; font: 700 8px/1 var(--mono); color: var(--muted); }
    .step.done .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
    .step.done .mark::after { content: "✓"; }
    .step.done .step-label { color: var(--muted); }
    .step.active:not(.static) { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .step.active:not(.static):hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .step.active .mark { border-color: var(--accent); }
    .step.active .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .step.active.running .mark::after { animation: dot-pulse 2s ease-in-out infinite; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
    .step.active .step-label { font-weight: 550; }
    .step.blocked .mark { border-color: var(--warm); color: var(--warm); background: var(--warm-tint); }
    .step.blocked .mark::after { content: "!"; }
    .step.blocked .step-label { color: var(--warm); font-weight: 550; }
    .step.delegated .mark { border-style: dashed; border-color: var(--accent); color: var(--accent); }
    .step.delegated .mark::after { content: "↳"; font-size: 9px; }
    .step-body { display: grid; gap: 3px; min-width: 0; }
    .live { font-size: 11px; color: var(--accent); }
    .live::before { content: "▸ "; }
    .meta { font-size: 10.5px; color: var(--muted); }
    .del { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--ink); }
    .del .t, .agent-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col .ask { margin-top: 4px; padding: 8px 10px; font-size: 11.5px; cursor: default; }
    .col .ask .btn { padding: 3px 7px; font-size: 10.5px; }
    .empty { color: var(--muted); font-size: 11px; padding: 8px; }

    .agents { display: grid; gap: 1px; padding: 0 6px 8px; }
    .section-label { display: flex; align-items: center; gap: 8px; padding: 10px 8px 4px; margin: 0 -6px; border-top: 1px solid var(--line); font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .section-label { padding-left: 14px; }
    .agent-row { display: grid; gap: 2px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 11.5px; min-width: 0; }
    .agent-row:hover { background: var(--hover-bg); }
    .agent-row .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .agent-row .sub { padding-left: 12px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-row.working .sub { color: var(--accent); }
    .agent-row.needs .t { color: var(--warm); }
    .agent-row .ask { margin: 4px 0 2px 12px; }
    .fold { text-align: left; border: 0; background: none; color: var(--muted); font-size: 10.5px; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fold:hover { background: var(--hover-bg); color: var(--ink); }

    /* Quiet lane and compact cards */
    .lane { display: grid; gap: 8px; min-width: 0; }
    .lane > h2, .bucket > h2 { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 550; color: var(--ink); }
    .lane > h2 { padding: 4px 2px 2px; }
    .lane > h2 small, .bucket > h2 small { font: 10px var(--mono); color: var(--muted); font-weight: 400; }
    .board-card { display: grid; gap: 7px; min-width: 0; padding: 11px 12px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
    .board-card:hover { border-color: var(--hover-line); }
    .board-card.needs { border-top: 2px solid var(--warm); }
    .board-card.working { border-top: 2px solid var(--accent); }
    .board-card.done { background: color-mix(in srgb, var(--surface) 60%, var(--paper)); }
    .board-card h3 { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .board-card .focus { display: grid; gap: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
    .board-card .focus .step-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 11.5px; }
    .board-card .focus .live, .board-card .focus .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .board-card .q { font-size: 11px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .board-card .q .chip { margin-right: 5px; }

    /* Cards view (default at large) */
    .bucket { margin-top: 20px; }
    .bucket:first-of-type { margin-top: 4px; }
    .bucket > h2 { margin-bottom: 10px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; align-items: start; }
    .more { justify-self: start; }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/fixture.js"></script>
<script src="../shared/mockup.js"></script>
<script>
"use strict";
(() => {
  const $ = AgentField.el;
  const ROLE_SHORT = {dispatcher: "Dispatcher", orchestrator: "Orchestrator", implementer: "Implementer", reviewer: "Reviewer", researcher: "Researcher", releaser: "Release", delegate: "Delegate", subagent: "Subagent"};
  const STEP_ORDER = ["done", "active", "delegated", "blocked", "todo"];
  const STEP_LABELS = {done: "done", active: "active", delegated: "delegated", blocked: "blocked", todo: "to do"};
  const BUCKETS = ["needs", "working", "waiting", "quiet"];
  const BUCKET_LABELS = {needs: "Needs you", working: "Working", waiting: "Waiting", quiet: "Quiet"};
  // User view state survives every re-render.
  const view = {mode: null, expanded: new Set(), showDone: new Set(), showQuiet: false, scrollLeft: 0};

  // A delegated step counts as done once its agent has finished.
  function stepState(field, s) { if (s.state === "delegated" && field.byId(s.agentId)?.status === "done") return "done"; return s.state in STEP_LABELS ? s.state : "todo"; }
  function tally(field, plans) {
    const c = {done: 0, active: 0, delegated: 0, blocked: 0, todo: 0, total: 0};
    for (const plan of plans) for (const s of plan) { c[stepState(field, s)]++; c.total++; }
    return c;
  }
  function segBar(c, cls) {
    const bar = $("div", "segbar" + (cls ? " " + cls : ""));
    bar.setAttribute("role", "img"); bar.setAttribute("aria-label", STEP_ORDER.filter(k => c[k]).map(k => c[k] + " " + STEP_LABELS[k]).join(", ") || "No plan");
    for (const k of STEP_ORDER) if (c[k]) { const s = $("i", k); s.style.flexGrow = c[k]; bar.append(s); }
    if (!c.total) bar.append($("i", "empty"));
    return bar;
  }
  const isFinished = (field, a) => a.status === "done" && field.descendants(a.id).every(d => d.status === "done");
  const clickable = (node, fn, label) => { node.tabIndex = 0; node.setAttribute("role", "button"); if (label) node.title = label; node.onclick = e => { e.stopPropagation(); fn(); }; node.onkeydown = e => { if (e.key === "Enter" && e.target === node) fn(); }; return node; };
  // statusLabel, but naming a single awaited agent and without "1 agents".
  function statusText(a, field) {
    if (a.status !== "blocked") return field.statusLabel(a);
    const ext = field.externalWaits(a), ag = field.agentWaits(a);
    return ext.length ? "Waiting on " + ext[0] : ag.length === 1 ? "Waiting on " + ag[0].title : ag.length ? "Waiting on " + ag.length + " agents" : "Waiting";
  }
  let askRank = new Map();
  const needsText = n => n + (n === 1 ? " needs you" : " need you");

  function bucketOf(field, sub) {
    if (sub.some(field.needsUser)) return "needs";
    if (sub.some(a => a.status === "working")) return "working";
    if (sub.some(a => a.status === "blocked" || a.status === "failed")) return "waiting";
    return "quiet";
  }

  function identity(a, field) {
    const id = $("div", "identity");
    id.append(AgentField.providerLogo(a.client, AgentField.PROVIDER_NAMES[a.client]));
    if (a.name && a.name !== ROLE_SHORT[a.role]) id.append($("span", "chip", a.name));
    id.append($("span", "role", ROLE_SHORT[a.role] + (a.kind !== "app" ? " · " + a.kind : "")));
    const when = $("span", "when", field.relativeTime(a.updatedAt)); when.title = new Date(a.updatedAt).toLocaleString(); id.append(when);
    return id;
  }
  function stateLine(a, field) {
    const st = $("div", "state " + a.status);
    // Keep the header short; the active step names what a waiting agent waits on.
    const label = $("span", "label", a.status === "blocked" ? "Waiting" : statusText(a, field)); label.title = statusText(a, field);
    st.append(AgentField.statusDot(a), label, AgentField.phaseSteps(a), $("span", null, AgentField.PHASE_LABELS[a.phase]));
    return st;
  }
  function progressLine(a, field, needs, withDot) {
    const c = tally(field, [a.plan]);
    const p = $("div", "progress");
    if (withDot) p.append(AgentField.statusDot(a));
    const k = $("span", "kofn"); k.append(String(c.done), $("small", null, " of " + c.total)); p.append(k, segBar(c));
    if (needs) p.append($("span", "needs-badge", needsText(needs)));
    return p;
  }
  function subtreeLine(r, field) {
    const d = field.descendants(r.id); if (!d.length) return null;
    const c = field.counts(d);
    const line = $("div", "subtree"); const dots = $("span", "dots");
    for (const a of d.slice(0, 10)) dots.append(AgentField.statusDot(a));
    const parts = [d.length + (d.length === 1 ? " agent" : " agents")];
    if (c.needsUser) parts.push(needsText(c.needsUser)); if (c.working) parts.push(c.working + " working"); if (c.done) parts.push(c.done + " done");
    line.append(dots, $("span", "t", parts.join(" · ")));
    return line;
  }
  // The line under an active step: what the owner is doing now, or why it is not moving.
  function ownerLine(a, field) {
    if (a.status === "working" && a.activity) return $("div", "live", a.activity);
    if (a.status === "blocked") return $("div", "meta", statusText(a, field));
    if (a.status === "failed") return $("div", "meta", "Failed" + (a.failure ? " · " + a.failure : ""));
    if (a.status === "idle") return $("div", "meta", "Idle since " + field.relativeTime(a.updatedAt));
    return null;
  }

  function stepRow(s, owner, field, api, ctx) {
    const st = stepState(field, s);
    const del = s.agentId ? field.byId(s.agentId) : null;
    const target = del || owner;
    const row = clickable($("div", "step " + st + (st === "active" && owner.status === "working" ? " running" : "")), () => api.select(target.id), "Open " + target.title);
    const body = $("div", "step-body"); body.append($("span", "step-label", s.label));
    if (del && s.state === "delegated") {
      const d = $("div", "del"); const dc = tally(field, [del.plan]);
      d.append(AgentField.statusDot(del), $("span", "t", del.title === s.label ? (del.name ? del.name + " · " : "") + ROLE_SHORT[del.role] + (del.kind !== "app" && del.kind !== del.role ? " · " + del.kind : "") : del.title));
      if (dc.total) { d.append(segBar(dc, "mini")); const k = $("span", "kofn"); k.append(String(dc.done), $("small", null, "/" + dc.total)); d.append(k); }
      body.append(d);
      const nested = field.descendants(del.id).length;
      if (st !== "done") body.append(del.status === "working" && del.activity ? $("div", "live", del.activity) : $("div", "meta", statusText(del, field) + (nested ? " · +" + nested + " nested" : "")));
      if (del.ask) body.append(Mockup.askBox(del, field, null));
    } else if (st === "active") {
      const line = ownerLine(owner, field); if (line && line.textContent !== s.label) body.append(line);
    } else if (st === "blocked") {
      if (owner.ask && !ctx.askShown) { ctx.askShown = true; body.append(Mockup.askBox(owner, field, null)); }
      else if (owner.waitingOn.length) body.append($("div", "meta", statusText(owner, field)));
    }
    row.append($("span", "mark"), body);
    return row;
  }

  function agentRow(k, depth, field, api) {
    const row = clickable($("div", "agent-row " + k.status + (field.needsUser(k) ? " needs" : "")), () => api.select(k.id), k.title + " · " + statusText(k, field));
    row.style.paddingLeft = (8 + depth * 14) + "px";
    const top = $("div", "top"); top.append(AgentField.statusDot(k), $("span", "t", k.title));
    const kc = tally(field, [k.plan]);
    if (kc.total) { top.append(segBar(kc, "mini")); const n = $("span", "kofn"); n.append(String(kc.done), $("small", null, "/" + kc.total)); top.append(n); }
    row.append(top, $("div", "sub", k.status === "working" && k.activity ? k.activity : statusText(k, field) + (k.kind !== "app" ? " · " + k.kind : "")));
    if (k.ask) row.append(Mockup.askBox(k, field, null));
    return row;
  }

  // A full board column: header, plan steps, then sub-agents that are not a delegated step.
  function column(r, field, api, onCollapse) {
    const sub = [r, ...field.descendants(r.id)];
    const needs = sub.filter(field.needsUser).length;
    const col = $("section", "col" + (needs ? " needs" : sub.some(a => a.status === "working") ? " working" : "") + (r.status === "done" ? " done" : ""));
    const head = clickable($("header", "col-head"), () => api.select(r.id), "Open " + r.title);
    const idRow = identity(r, field);
    if (onCollapse) { const b = $("button", "btn quiet small", "Collapse"); b.type = "button"; b.onclick = e => { e.stopPropagation(); onCollapse(); }; idRow.append(b); }
    head.append(idRow, $("h3", null, r.title), stateLine(r, field), progressLine(r, field, needs, false));
    col.append(head);

    const steps = $("div", "steps"); const ctx = {askShown: false};
    for (const s of r.plan) steps.append(stepRow(s, r, field, api, ctx));
    if (r.ask && !ctx.askShown) { const box = Mockup.askBox(r, field, null); box.style.margin = "2px 2px 4px"; steps.prepend(box); }
    if (!r.plan.length) steps.append($("p", "empty", "No plan reported."));
    col.append(steps);

    const delegated = new Set(r.plan.map(s => s.agentId).filter(Boolean));
    const rows = []; const walk = (pid, depth) => { for (const k of field.children(pid)) { if (depth === 0 && delegated.has(k.id)) continue; rows.push({a: k, depth}); walk(k.id, depth + 1); } };
    walk(r.id, 0);
    if (rows.length) {
      const sec = $("div", "agents");
      const lab = $("div", "section-label"); lab.append("Agents", $("span", null, String(rows.length))); sec.append(lab);
      const finished = rows.filter(x => isFinished(field, x.a)); const showDone = view.showDone.has(r.id);
      for (const x of rows) if (showDone || !isFinished(field, x.a)) sec.append(agentRow(x.a, x.depth, field, api));
      if (finished.length) {
        const b = $("button", "fold", showDone ? "Hide finished" : "✓ " + finished.length + " finished · " + finished.map(x => x.a.title).join(", ")); b.type = "button";
        b.onclick = e => { e.stopPropagation(); if (showDone) view.showDone.delete(r.id); else view.showDone.add(r.id); api.rerender(); };
        sec.append(b);
      }
      col.append(sec);
    }
    return col;
  }

  // Compact card: only the step that matters now and a progress bar. Click to expand into the full column.
  function compactCard(r, field, api, onExpand) {
    const sub = [r, ...field.descendants(r.id)];
    const needs = sub.filter(field.needsUser).length;
    const card = clickable($("article", "board-card" + (needs ? " needs" : sub.some(a => a.status === "working") ? " working" : "") + (r.status === "done" ? " done" : "")), onExpand, "Show the plan");
    card.setAttribute("aria-expanded", "false");
    const idRow = identity(r, field);
    const open = $("button", "btn quiet small", "↗"); open.type = "button"; open.title = "Open thread"; open.onclick = e => { e.stopPropagation(); api.select(r.id); }; idRow.append(open);
    card.append(idRow, $("h3", null, r.title), progressLine(r, field, needs, true));
    const states = r.plan.map(s => stepState(field, s));
    const idx = ["blocked", "active", "delegated"].map(k => states.indexOf(k)).find(i => i >= 0) ?? -1;
    const focus = $("div", "focus");
    if (r.ask) {
      const s = r.plan[states.indexOf("blocked")];
      const row = $("div", "step static blocked"); const body = $("div", "step-body");
      if (s) body.append($("span", "step-label", s.label));
      const q = $("div", "q"); q.append($("span", "chip warm mono", r.ask.kind), r.ask.question); body.append(q);
      row.append($("span", "mark"), body); focus.append(row);
    } else if (idx >= 0) {
      const s = r.plan[idx]; const del = s.agentId ? field.byId(s.agentId) : null;
      const row = $("div", "step static " + states[idx] + (states[idx] === "active" && r.status === "working" ? " running" : "")); const body = $("div", "step-body");
      body.append($("span", "step-label", s.label));
      const line = del ? (del.status === "working" && del.activity ? $("div", "live", del.activity) : $("div", "meta", statusText(del, field))) : ownerLine(r, field);
      if (line && line.textContent !== s.label) body.append(line);
      row.append($("span", "mark"), body); focus.append(row);
    } else {
      const row = $("div", "step static " + (states.length && states.every(s => s === "done") ? "done" : "todo")); const body = $("div", "step-body");
      body.append($("span", "step-label", states.length ? (states.every(s => s === "done") ? "All " + states.length + " steps done" : "Not started") : "No plan reported"));
      body.append($("div", "meta", r.summary.split(/(?<=\.)\s/)[0]));
      row.append($("span", "mark"), body); focus.append(row);
    }
    // When the ask belongs to a sub-agent, surface it on the card so the reason for "needs you" is visible.
    const childAsk = r.ask ? null : sub.slice(1).filter(a => a.ask).sort((x, y) => (askRank.get(x.id) ?? 1e9) - (askRank.get(y.id) ?? 1e9))[0];
    if (childAsk) {
      const row = clickable($("div", "step static blocked child-ask"), () => api.select(childAsk.id), "Open " + childAsk.title);
      const body = $("div", "step-body"); body.append($("span", "step-label", childAsk.title));
      const q = $("div", "q"); q.append($("span", "chip warm mono", childAsk.ask.kind), childAsk.ask.question); body.append(q);
      row.append($("span", "mark"), body); focus.append(row);
    }
    card.append(focus);
    const st = subtreeLine(r, field); if (st) card.append(st);
    return card;
  }

  function boardItem(r, field, api) {
    if (view.expanded.has(r.id)) return column(r, field, api, () => { view.expanded.delete(r.id); api.rerender(); });
    return compactCard(r, field, api, () => { view.expanded.add(r.id); api.rerender(); });
  }

  function stat(value, total, label, cls) {
    const s = $("div", "stat" + (cls ? " " + cls : "")); const b = $("b", null, String(value));
    if (total != null) b.append($("small", null, " / " + total));
    s.append(b, $("span", null, label)); return s;
  }

  function rollup(field, items, asks, api) {
    const c = tally(field, field.agents.map(a => a.plan));
    const counts = field.counts();
    const blocking = asks.filter(a => a.ask?.blocking).length;
    const wrap = $("section", "rollup");
    const top = $("div", "rollup-top");
    top.append(stat(c.done, c.total, "steps done across " + field.agents.length + " agents"),
      stat(asks.length, null, "asks open" + (blocking ? " · " + blocking + " blocking" : ""), asks.length ? "warm" : ""),
      stat(counts.working, null, "agents working", counts.working ? "accent" : ""),
      stat(items.filter(i => i.bucket !== "quiet").length, items.length, "boards active"));
    const toggle = $("div", "view-toggle");
    for (const [mode, label] of [["columns", "Columns"], ["cards", "Cards"]]) {
      const b = $("button", "btn small", label); b.type = "button"; b.setAttribute("aria-pressed", String(view.mode === mode));
      b.onclick = () => { view.mode = mode; api.rerender(); }; toggle.append(b);
    }
    top.append(toggle);
    const legend = $("div", "legend");
    for (const k of STEP_ORDER) { const s = $("span"); s.append($("i", k), $("b", null, String(c[k])), STEP_LABELS[k]); legend.append(s); }
    wrap.append(top, segBar(c, "big"), legend);
    return wrap;
  }

  Mockup.mount({
    number: 7, title: "Plan boards", spectrum: "radical",
    summary: "Each root agent is a column of its own plan steps; delegated steps carry the sub-agent’s progress, and the top rolls up every step in the field.",
    signals: {current: ["title", "status", "phase", "summary", "next_actor", "created_by", "client", "updated_at"],
      proposed: ["plan", "activity", "ask", "blocks", "waiting_on", "name", "role", "kind"]},
    notes: "Assumes every agent reports a short ordered plan with step states, and that a delegated step names the agent it was handed to; sub-agents not tied to a step are listed under Agents.",
    render(field, stage, api) {
      const prev = stage.querySelector(".board"); if (prev) view.scrollLeft = prev.scrollLeft;
      stage.replaceChildren();
      view.mode ??= field.scale === "large" ? "cards" : "columns";
      const asks = field.asks();
      const rank = askRank = new Map(asks.map((a, i) => [a.id, i]));
      const items = field.roots().map(r => {
        const sub = [r, ...field.descendants(r.id)];
        return {r, bucket: bucketOf(field, sub), rank: Math.min(...sub.map(a => rank.get(a.id) ?? Infinity)), updated: Math.max(...sub.map(a => a.updatedAt))};
      }).sort((x, y) => BUCKETS.indexOf(x.bucket) - BUCKETS.indexOf(y.bucket) || x.rank - y.rank || y.updated - x.updated);
      stage.append(rollup(field, items, asks, api));

      if (view.mode === "columns") {
        const active = items.filter(i => i.bucket !== "quiet"), quiet = items.filter(i => i.bucket === "quiet");
        const board = $("div", "board");
        board.style.gridTemplateColumns = (active.length ? "repeat(" + active.length + ", minmax(224px, 1fr))" : "") + (quiet.length ? " minmax(180px, .8fr)" : "");
        for (const i of active) board.append(column(i.r, field, api));
        if (quiet.length) {
          const lane = $("section", "lane"); const h = $("h2", null, "Quiet"); h.append($("small", null, quiet.length + " idle or finished")); lane.append(h);
          for (const i of quiet) lane.append(boardItem(i.r, field, api));
          board.append(lane);
        }
        if (!items.length) board.append($("p", "empty", "No agents."));
        stage.append(board);
        board.scrollLeft = view.scrollLeft;
        board.onscroll = () => { view.scrollLeft = board.scrollLeft; };
        return;
      }
      for (const b of BUCKETS) {
        const list = items.filter(i => i.bucket === b); if (!list.length) continue;
        const sec = $("section", "bucket");
        const steps = tally(field, list.map(i => i.r.plan));
        const h = $("h2", null, BUCKET_LABELS[b]); h.append($("small", null, list.length + " boards · " + steps.done + " of " + steps.total + " steps done")); sec.append(h);
        if (b === "quiet" && !view.showQuiet) {
          const more = $("button", "btn small more", "Show " + list.length + " quiet boards"); more.type = "button"; more.onclick = () => { view.showQuiet = true; api.rerender(); };
          sec.append(more); stage.append(sec); continue;
        }
        const grid = $("div", "cards");
        for (const i of list) grid.append(boardItem(i.r, field, api));
        sec.append(grid); stage.append(sec);
      }
    },
  });
})();
</script>
</body>
</html>
