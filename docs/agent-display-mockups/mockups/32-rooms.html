    marker = svg('g'); marker.append(svg('path', {d: 'M0 0 L-11 -23 Q0 -29 11 -23 Z', class: 'map-cone'}), svg('circle', {r: 3, class: 'map-camera'})); plan.append(marker);
    const foot = node('div', 'map-foot');
    foot.innerHTML = '<kbd>WASD / arrows</kbd> walk · <kbd>Q E / drag</kbd> turn<br><kbd>Tab / 1–9</kbd> room · <kbd>Esc</kbd> corridor<br><kbd>Enter</kbd> nearest card · <kbd>g</kbd> group';
    map.replaceChildren(head, plan, foot);
  }
  function titleLine() {
    const g = groups.find(g => g.key === currentKey);
    title.replaceChildren('Rooms', node('span', '', ` · ${F.agents.length} agents · ${groups.length} rooms · in: ${g?.name || 'corridor'}`));
  }
  function updateCamera() {
    world.style.transform = `translateZ(${P}px) rotateY(${cam.yaw}deg) translate3d(${-cam.x}px,0px,${-cam.z}px)`;
    const r = cam.yaw * Math.PI / 180;
    for (const {el, x, y, z} of placements.values()) {
      el.style.transition = glide || held.size || dragging ? 'none' : '';
      at(el, x, y, z, '', true);
      const depth = -(x - cam.x) * Math.sin(r) + (z - cam.z) * Math.cos(r);
      el.style.visibility = depth < -100 ? 'visible' : 'hidden';
      el.inert = depth >= -100;
    }
    for (const el of doorLayer.children) {
      const p = el._pos; at(el, p.x, p.y, p.z, '', true);
      const depth = -(p.x - cam.x) * Math.sin(r) + (p.z - cam.z) * Math.cos(r);
      el.style.visibility = depth < -100 ? 'visible' : 'hidden'; el.inert = depth >= -100;
    }
    const p = mapPoint(cam.x, cam.z);
    marker?.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${cam.yaw})`);
    scene.dataset.camera = JSON.stringify(cam); scene.dataset.currentRoom = currentKey || 'corridor';
  }
  function roomAtCamera() { return groups.find(g => cam.x * g.side > HALL && cam.x * g.side < HALL + g.depth && Math.abs(cam.z - g.z) < g.width / 2); }
  function changedRoom() {
    const next = roomAtCamera()?.key || null;
    if (next !== currentKey) { currentKey = next; paintCards(); paintMap(); titleLine(); }
    else if ([...nearby()].join('|') !== materialKey) paintCards();
  }
  function jump(g) {
    held.clear();
    const goal = g ? {x: g.side * (HALL + g.depth * .12), z: g.z, yaw: g.side * 90} : {x: 0, z: Math.min(0, cam.z + 180), yaw: 0};
    currentKey = g?.key || null; paintCards(); paintMap(); titleLine();
    // Take the short turn even after several rotations.
    const yawDelta = ((goal.yaw - cam.yaw + 540) % 360 + 360) % 360 - 180;
    goal.yaw = cam.yaw + yawDelta;
    if (reduced.matches) { Object.assign(cam, goal); glide = null; updateCamera(); return; }
    glide = {from: {...cam}, goal, start: performance.now()}; schedule();
  }
  function schedule() { if (!raf) { lastFrame = performance.now(); raf = requestAnimationFrame(frame); } }
  function frame(now) {
    raf = 0; const dt = Math.min(.04, (now - lastFrame) / 1000); lastFrame = now;
    if (glide) {
      const t = clamp((now - glide.start) / 300, 0, 1), ease = t * t * (3 - 2 * t);
      for (const k of ['x', 'z', 'yaw']) cam[k] = glide.from[k] + (glide.goal[k] - glide.from[k]) * ease;
      if (t === 1) glide = null;
    } else if (held.size) {
      const r = cam.yaw * Math.PI / 180;
      const f = Number(held.has('w') || held.has('arrowup')) - Number(held.has('s') || held.has('arrowdown'));
      const s = Number(held.has('d') || held.has('arrowright')) - Number(held.has('a') || held.has('arrowleft'));
      cam.x += (Math.sin(r) * f + Math.cos(r) * s) * 750 * dt;
      cam.z += (-Math.cos(r) * f + Math.sin(r) * s) * 750 * dt;
      cam.yaw += (Number(held.has('e')) - Number(held.has('q'))) * 100 * dt;
      constrain(); changedRoom();
    }
    updateCamera(); if (glide || held.size) raf = requestAnimationFrame(frame);
  }
  function constrain() {
    cam.z = clamp(cam.z, -FIRST - Math.ceil(groups.length / 2) * STEP + 400, 600);
    const room = groups.find(g => cam.x * g.side > HALL - 70 && Math.abs(cam.z - g.z) < g.width / 2 - 60);
    cam.x = clamp(cam.x, room?.side === -1 ? -(HALL + room.depth - 180) : -HALL + 70, room?.side === 1 ? HALL + room.depth - 180 : HALL - 70);
  }
  function nearest() {
    const r = cam.yaw * Math.PI / 180;
    return [...placements.entries()].filter(([, p]) => -(p.x - cam.x) * Math.sin(r) + (p.z - cam.z) * Math.cos(r) < -100)
      .sort(([, a], [, b]) => Math.hypot(a.x - cam.x, a.z - cam.z) - Math.hypot(b.x - cam.x, b.z - cam.z))[0]?.[0];
  }
  function build(stage) {
    stageEl = stage; scene = node('section', 'scene'); scene.setAttribute('aria-label', 'First-person rooms. Movement instructions are in the mini-map.');
    world = node('div', 'world'); furniture = node('div'); doorLayer = node('div'); cardLayer = node('div');
    // Each layer must preserve the world rather than flatten its CSS 3D children.
    for (const el of [furniture, doorLayer, cardLayer]) el.style.transformStyle = 'preserve-3d';
    world.append(furniture, doorLayer, cardLayer); title = node('h1', 'titleline'); map = node('nav', 'minimap'); map.setAttribute('aria-label', 'Floor plan and navigation');
    scene.append(world, title, map);
    scene.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('button, input, .minimap, .card3d')) return;
      dragging = {x: e.clientX, yaw: cam.yaw, moved: false}; scene.setPointerCapture(e.pointerId);
    });
    scene.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - dragging.x;
      if (Math.abs(dx) > 4) { dragging.moved = true; scene.classList.add('dragging'); glide = null; cam.yaw = dragging.yaw - dx * .18; updateCamera(); }
    });
    const finish = () => { dragging = null; scene.classList.remove('dragging'); };
    scene.addEventListener('pointerup', finish); scene.addEventListener('pointercancel', finish);
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input, textarea, select, [contenteditable], .drawer')) return;
      if (e.target.closest('button, [role="button"]') && ['Enter', ' ', 'Tab'].includes(e.key)) return;
      const k = e.key.toLowerCase();
      if (['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) { e.preventDefault(); glide = null; held.add(k); schedule(); }
      else if (k === 'tab') { e.preventDefault(); const i = groups.findIndex(g => g.key === currentKey); jump(groups[(i + (e.shiftKey ? groups.length - 1 : 1)) % groups.length]); }
      else if (/^[1-9]$/.test(k)) { if (groups[Number(k) - 1]) jump(groups[Number(k) - 1]); }

      else if (k === 'enter') { const id = nearest(); if (id) API.select(id); }
      else if (k === 'g') {
        grouping = modes[(modes.indexOf(grouping) + 1) % modes.length]; groups = []; currentKey = null; glide = null;
        Object.assign(cam, {x: 0, z: 0, yaw: 0}); API.rerender();
      }
    });
    document.addEventListener('keyup', e => held.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { held.clear(); dragging = null; });
  }
  Mockup.mount({
    number: 32, title: 'Rooms', spectrum: '3D', fullBleed: true, showChrome: false,
    summary: 'One room per group on a floor plan: walk the corridor, read the door badges, step into a room to see its root on the far wall and its agents by status; asks come to the door.',
    signals: {current: ['title','phase','summary','next_action','next_actor','created_by','client','status','updated_at','checkpoint_history','messages','tool_activity'],
      proposed: ['name','role','kind','activity','ask','plan','target','domain','cost']},
    notes: 'Corridor floor plan: paired doors give a stable route and let asks stand at the threshold. Root families merge by root target; g cycles target/domain/family. Four primary visual channels: mass (turns + history.length + cost.minutes/10) scales room area; group gravity (sum of heat from pulses and lastTool.at, half-life 20 simulated minutes) sets room brightness and dust; status sets wall position/height; neglect orders doorstep asks and is printed on badges. Heat feeds gravity rather than a separate channel. Walking adds travel, occlusion, and spatial-memory costs versus 2D cards. Door badges and every-ask map dots protect discoverability, and map/Tab jumps reduce travel, but they do not compensate for losing simultaneous readable comparisons across groups. Only the current room and neighboring doors materialize cards; large-scale distant rooms remain plaques, and wall pages cap non-ask cards. This is a comparison experiment, not a recommendation to replace the 2D view.',
    render(field, stage, api) {
      F = field; API = api; const focus = rememberFocus();
      if (!scene) build(stage);
      if (lastField !== field) { cards.clear(); cardLayer.replaceChildren(); lastField = field; geometryKey = ''; }
      derive(); stage.replaceChildren(scene); geometry();
      doorLayer.replaceChildren(...groups.map(plaque));
      paintCards(); paintMap(); titleLine(); updateCamera(); restoreFocus(focus);
    }
  });
})();
