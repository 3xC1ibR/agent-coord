<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 30 · Working set</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* Horizontal groups, vertical states. Both axes retain their position. */
    body { height: 100dvh; overflow: hidden; }
    #stage { overflow: hidden; }
    .viewport, .vtrack, .htrack { position: absolute; inset: 0; }
    .viewport { overflow: hidden; }
    .vtrack, .htrack { transition: transform .34s cubic-bezier(.2,.7,.2,1); }
    .still .vtrack, .still .htrack, .still .page { transition: none !important; }
    .pane { position: absolute; left: 0; right: 0; height: 100%; overflow: hidden; }
    .page { position: absolute; top: 0; bottom: 0; padding: 26px 4px 225px; overflow-y: auto; overscroll-behavior: contain; transition: opacity .34s; container-type: inline-size; }
    .page.neighbor { opacity: .3; cursor: pointer; }
    .page.neighbor > * { pointer-events: none; }
    .page.far { visibility: hidden; }
    .page-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .page-title h2 { font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
    .level-title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .level-title h3 { font-size: 17px; font-weight: 500; }
    .level-title span { font: 11px var(--mono); color: var(--muted); }
    .description { margin-bottom: 24px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .section { margin: 22px 0; }
    .section-title { display: flex; align-items: baseline; gap: 10px; padding-bottom: 9px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
    .section-title h4 { font-size: 13px; font-weight: 600; }
    .section-title span { font: 11px var(--mono); color: var(--muted); }
    .section.asks .section-title h4 { color: var(--warm); }
    .section.running .section-title h4 { color: var(--accent); }
    .phase-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 14px; align-items: start; margin: 22px 0; }
    .phase-board > .section { min-width: 0; margin: 0; }
    .phase-board .cards { grid-template-columns: minmax(0, 1fr); }
    .phase-board .thread { min-width: 0; overflow-wrap: anywhere; }
    .phase-board .identity { flex-wrap: wrap; }
    @container (max-width: 900px) {
      .phase-board { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
    }
    .parent-link { border: 0; background: transparent; text-align: left; padding: 0; font-size: 10px; color: var(--muted); cursor: pointer; }
    .parent-link:hover { color: var(--ink); }
    .group-link { align-self: flex-start; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 3px 7px; color: var(--muted); font-size: 10px; text-align: left; cursor: pointer; }
    .group-link:hover { border-color: var(--hover-line); color: var(--ink); }
    .parked { font-size: 10px; color: var(--muted); }
    .thread.parked-thread { opacity: .65; }
    .more { margin-top: 12px; }
    .empty-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .minimap { position: absolute; right: 18px; bottom: 18px; z-index: 30; width: min(420px, calc(100% - 36px)); padding: 11px; background: color-mix(in srgb, var(--surface) 95%, transparent); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: 0 8px 26px var(--shadow); backdrop-filter: blur(6px); }
    .mm-group { display: flex; gap: 8px; align-items: center; padding-bottom: 9px; font-size: 12px; }
    .mm-group select { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; }
    .mm-group button { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .mm-group button:disabled { opacity: .35; cursor: default; }
    .mm-body { display: flex; gap: 8px; }
    .mm-labels { flex: 0 0 156px; display: grid; gap: 5px; }
    .mm-label { height: 30px; border: 0; border-radius: 4px; background: transparent; text-align: left; font-size: 10px; color: var(--muted); cursor: pointer; padding: 0 6px; }
    .mm-label.here { background: var(--hover-bg); color: var(--ink); font-weight: 600; }
    .mm-matrix { flex: 1; overflow-x: auto; display: grid; grid-template-rows: repeat(3, 30px); gap: 5px; padding: 1px 1px 5px; }
    .mm-cells { display: flex; gap: 4px; }
    .mm-cell { flex: 0 0 28px; position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--muted); font: 10px var(--mono); cursor: pointer; }
    .mm-cell.mark { border-color: var(--accent); color: var(--ink); }
    .mm-cell.lit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .mm-cell.empty-cell:not(.lit) { opacity: .5; }
    .mm-cell.needs-reply:not(.lit) { color: var(--warm); }
    .mm-cell .presence-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; vertical-align: middle; }
    .mm-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); font: 10px var(--mono); color: var(--muted); }
    .mm-note { margin-top: 5px; color: var(--muted); font-size: 9px; }
    @media (max-width: 600px) { .cards { grid-template-columns: 1fr !important; } .page-title h2 { font-size: 20px; } .mm-labels { flex-basis: 144px; } }
    @media (prefers-reduced-motion: reduce) { .vtrack, .htrack, .page { transition: none !important; } }
    /* Live cards (the 01 card). */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
    .thread { position: relative; display: flex; flex-direction: column; gap: 9px; padding: 14px 16px 11px; cursor: pointer; }
    .thread:hover { border-color: var(--hover-line); box-shadow: 0 4px 14px color-mix(in srgb, var(--ink) 4%, transparent); }
    .identity { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 10px; color: var(--muted); }
    .identity .provider-logo { width: 13px; height: 13px; flex: none; }
    .identity .when { margin-left: auto; font-family: var(--mono); white-space: nowrap; }
    .thread h3 { font-size: 14px; font-weight: 550; letter-spacing: -.02em; line-height: 1.4; }
    .lead.thread h3 { font-size: 16px; }
    .state { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    .state .label { color: var(--ink); }
    .state.working .label { color: var(--accent); }
    .state.waiting .label { color: var(--warm); }
    .state.failed .label { color: var(--danger); }
    .activity { font-size: 11.5px; color: var(--accent); line-height: 1.5; }
    .activity::before { content: "▸ "; }
    .summary { font-size: 12px; line-height: 1.65; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lead .summary { -webkit-line-clamp: 3; }
    .thread.done .summary::before { content: "Completed · "; color: var(--ok); }
    .next { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 9px; font-size: 11px; line-height: 1.55; }
    .next b { font-weight: 600; }
    .next.external b, .next.agent b { color: var(--muted); }
    .agents { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-top: 9px; }
    .agents .count { font: 10px var(--mono); color: var(--muted); margin-right: 2px; }
    .agent-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 8px 3px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 11px; color: var(--ink); cursor: pointer; }
    .agent-chip:hover { border-color: var(--hover-line); }
    .agent-chip.needs { border-color: var(--warm); background: var(--warm-tint); }
    .agent-chip small { color: var(--muted); font-size: 10px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-chip .t { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .footer { display: flex; align-items: center; gap: 6px; }
    .empty { color: var(--muted); font-size: 12px; padding: 30px 0; }

  </style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/real-threads.js"></script>
<script src="../shared/fixture.js"></script>
<script src="../shared/mockup.js"></script>
<script>

"use strict";
(() => {
  const $ = AgentField.el;
  const REAL_CARD_CAP = 12;
  const ALL_GROUPS_KEY = "overview:all";
  const LEVELS = ["Running + Needs my reply", "Replies to read", "Idle"];
  const GROUPINGS = {sim: ["target", "domain", "family"], real: ["group", "domain", "workspace"]};
  const GROUPING_LABELS = {target: "target", domain: "domain", family: "root family", group: "group", workspace: "workspace"};
  const ROLE_SHORT = {dispatcher: "Dispatcher", orchestrator: "Orchestrator", implementer: "Implementer", reviewer: "Reviewer", researcher: "Researcher", releaser: "Release", delegate: "Delegate", subagent: "Subagent"};
  let lens = 1, grouping = "target", pageKey = null, pageIdx = 0;
  const showAll = new Set(), pageScroll = new Map(), initialized = new WeakSet();
  let F = null, API = null, groups = [], orderedKeys = [], orderContext = "", positionContext = "";
  let stageEl = null, viewport, vtrack, minimap, tracks = [], panes = [];
  const isReal = () => F?.scale === "real";
  const folder = path => (path || "unknown").replace(/\/$/, "").split("/").pop() || path;
  const later = a => a.attention === "later" || a.attention === "archived";
  const positionKey = field => "agent-display-mockup-30:position:v1:" + JSON.stringify([field.scale, field.workspace || "all", field.scenario || ""]);
  function restorePosition(field) {
    const key = positionKey(field);
    if (key === positionContext) return;
    positionContext = key;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(key)); } catch { /* Storage can be unavailable for local files. */ }
    const choices = GROUPINGS[isReal() ? "real" : "sim"];
    grouping = choices.includes(saved?.grouping) ? saved.grouping : choices[0];
    lens = Number.isInteger(saved?.lens) && saved.lens >= 0 && saved.lens < LEVELS.length ? saved.lens : 1;
    pageKey = typeof saved?.pageKey === "string" ? saved.pageKey : ALL_GROUPS_KEY;
    pageIdx = 0;
    orderContext = ""; orderedKeys = []; pageScroll.clear();
  }
  function savePosition() {
    try { localStorage.setItem(positionContext, JSON.stringify({grouping, lens, pageKey})); } catch { /* Navigation still works without persistence. */ }
  }
  function rootOf(field, a) { let r = a; while (r.parentId && field.byId(r.parentId)) r = field.byId(r.parentId); return r; }
  function keyFor(field, a) {
    const r = rootOf(field, a);
    if (isReal()) {
      if (grouping === "domain") return ["d:" + (a.domain || "none"), a.domain || "No domain"];
      if (grouping === "workspace") return ["w:" + (a.workspace || "unknown"), (a.workspace || "unknown").replace(/^\/opt\/projects\/?/, "") || folder(a.workspace)];
      const g = a.group ? a : r.group ? r : null;
      return g ? ["g:" + (g.groupId || g.group), g.group] : ["u:" + (a.workspace || "unknown"), "Ungrouped" + (field.workspace === "all" ? " · " + folder(a.workspace) : "")];
    }
    if (grouping === "domain") return [r.domain || "none", r.domain ? AgentField.DOMAIN_LABELS[r.domain] || r.domain : "No domain"];
    if (grouping === "family") return [r.id, r.name ? r.name + " · " + r.title : r.title];
    return [r.target || "root:" + r.id, r.target || r.title];
  }
  const touchOf = a => Math.max(a.lastTurnAt || 0, a.createdAt || 0, ...a.history.filter(h => h.actor === "user").map(h => h.at));
  // A thread occupies exactly one level. A parked response stays parked;
  // an actually running agent is still visible at the top, even if parked.
  const levelOf = a => a.status === "working" || (!later(a) && F.needsUser(a)) ? 0 : !later(a) && a.unread ? 1 : 2;
  function derive(field) {
    const map = new Map();
    const all = {key: ALL_GROUPS_KEY, name: "All groups", aggregate: true, members: [...field.agents], levels: [[], [], []]};
    for (const a of field.agents) {
      const [key, name] = keyFor(field, a);
      if (!map.has(key)) map.set(key, {key, name, members: [], levels: [[], [], []]});
      const g = map.get(key); g.members.push(a); g.levels[levelOf(a)].push(a);
      all.levels[levelOf(a)].push(a);
    }
    for (const g of [all, ...map.values()]) {
      g.touch = Math.max(...g.members.map(touchOf));
      for (const list of g.levels) list.sort((a, b) => Number(later(a)) - Number(later(b)) || touchOf(b) - touchOf(a) || a.id.localeCompare(b.id));
    }
    const context = field.scale + ":" + (field.workspace || "") + ":" + grouping;
    if (context !== orderContext) { orderContext = context; orderedKeys = []; pageScroll.clear(); }
    // Order once by recency; a completion must not move groups under your hand.
    const newcomers = [...map.values()].filter(g => !orderedKeys.includes(g.key)).sort((a, b) => b.touch - a.touch || a.name.localeCompare(b.name));
    orderedKeys = orderedKeys.filter(key => map.has(key)).concat(newcomers.map(g => g.key));
    return [all, ...orderedKeys.map(key => map.get(key))];
  }
  /* Real asks are free text with no options: show the question and open the thread to answer, as in mockup 29. */
  function askFor(a, field, api) {
    if (a.ask?.options?.length || !a.real) return Mockup.askBox(a, field, api ? api.select : null);
    const box = $("div", "ask");
    box.append($("span", "ask-kind", a.ask ? a.ask.kind : "next step"), $("div", "ask-question", a.ask?.question || a.next.action), $("span", "ask-impact", "Asked " + field.relativeTime(a.ask?.askedAt || a.updatedAt)));
    const open = $("button", "btn small", "Open thread"); open.type = "button"; open.style.marginTop = "8px"; open.style.display = "block";
    open.onclick = e => { e.stopPropagation(); (api || API).select(a.id); }; box.append(open);
    return box;
  }

  /* Every qualifying thread is a card; parent links retain context without pulling in older siblings. */
  function liveCard(a, field, api, {lead = false} = {}) {
    const el = $("article", "card thread " + a.status + (field.needsUser(a) ? " needs-you" : "") + (a.status === "working" ? " working" : "") + (lead ? " lead" : ""));
    el.dataset.thread = a.id; el.tabIndex = 0; el.onclick = () => api.select(a.id); el.onkeydown = e => { if (e.key === "Enter" && e.target === el) api.select(a.id); };
    const id = $("div", "identity");
    id.append(AgentField.providerLogo(a.client, AgentField.PROVIDER_NAMES[a.client]));
    if (a.name && a.name !== ROLE_SHORT[a.role]) id.append($("span", "chip", a.name));
    id.append($("span", null, ROLE_SHORT[a.role] + (a.kind !== "app" ? " · " + a.kind : "")));
    const when = $("span", "when", field.relativeTime(a.updatedAt)); when.title = new Date(a.updatedAt).toLocaleString(); id.append(when);
    el.append(id, $("h3", null, a.title));
    const st = $("div", "state " + a.status);
    st.append(AgentField.statusDot(a), $("span", "label", field.statusLabel(a)), AgentField.phaseSteps(a), $("span", null, AgentField.PHASE_LABELS[a.phase]));
    const prog = field.progress(a); if (prog.total && a.status !== "done") st.append($("span", "mono", prog.done + "/" + prog.total));
    el.append(st);
    if (a.activity && a.status === "working") el.append($("div", "activity", a.activity));
    if (a.ask) el.append(askFor(a, field, null));
    else { const s = $("p", "summary", a.summary); s.title = a.summary; el.append(s); }
    if (!a.ask && a.next?.action && a.status !== "done") {
      const n = $("div", "next " + a.next.actor);
      n.append($("span", null, "↳"), $("span")); n.lastChild.append($("b", null, ({user: "Your next step", agent: "Up next", external: "Waiting on"}[a.next.actor] || "Next") + " · "), a.next.action);
      el.append(n);
    }
    const parent = field.parent(a.id);
    if (parent) {
      const via = $("button", "parent-link", "Under " + parent.title); via.type = "button";
      via.onclick = e => { e.stopPropagation(); api.select(parent.id); }; el.append(via);
    }
    if (later(a)) el.append($("span", "parked", "Parked in Later"));
    if (a.unread) {
      const f = $("div", "footer"); const d = $("button", "btn quiet small", "Mark read"); d.type = "button";
      d.title = "Mark read in this preview only";
      d.onclick = e => { e.stopPropagation(); field.dismiss(a.id); }; f.append(d); el.append(f);
    }
    return el;
  }


  function section(page, g, items, title, key, cls = "") {
    if (!items.length) return;
    const sec = $("section", "section " + cls); sec.dataset.section = key;
    if (key !== "replies") {
      const head = $("header", "section-title"); head.append($("h4", null, title));
      if (key === "asks") head.append($("span", null, String(items.length)));
      sec.append(head);
    }
    const expandedKey = g.key + ":" + key;
    const cap = isReal() && !showAll.has(expandedKey) ? REAL_CARD_CAP : Infinity;
    const grid = $("div", "cards");
    for (const a of items.slice(0, cap)) {
      const card = liveCard(a, F, API); card.classList.toggle("parked-thread", later(a));
      if (g.aggregate) {
        const [key, name] = keyFor(F, a), group = $("button", "group-link", name);
        group.type = "button"; group.title = "Open " + name + " at this level";
        group.onclick = e => { e.stopPropagation(); const i = groups.findIndex(g => g.key === key); if (i >= 0) goPage(i); };
        card.append(group);
      }
      grid.append(card);
    }
    sec.append(grid);
    if (isReal() && items.length > REAL_CARD_CAP) {
      const expanded = showAll.has(expandedKey), b = $("button", "btn quiet small more", expanded ? "Show recent" : "Show all");
      b.type = "button"; b.onclick = () => { expanded ? showAll.delete(expandedKey) : showAll.add(expandedKey); paint(false); }; sec.append(b);
    }
    page.append(sec);
  }
  function pageFor(g, i, level) {
    const page = $("section", "page"); page.dataset.key = g.key; page.dataset.i = i; page.dataset.level = level;
    const items = g.levels[level], head = $("header", "page-title");
    head.append($("h2", null, g.name)); page.append(head);
    const title = $("div", "level-title"); title.append($("h3", null, LEVELS[level]));
    if (level === 1 && items.length) title.append($("span", null, String(items.length)));
    page.append(title);
    if (!items.length) {
      const scope = g.aggregate ? "across these groups" : "in this group";
      page.append($("p", "empty", ["Nothing running or waiting for your reply ", "No unread replies ", "No idle threads "][level] + scope + "."));
      const links = $("div", "empty-links");
      g.levels.forEach((list, n) => { if (n === level || !list.length) return; const b = $("button", "btn small", LEVELS[n]); b.type = "button"; b.onclick = () => goLens(n); links.append(b); });
      page.append(links);
    }
    if (level === 0) {
      section(page, g, items.filter(F.needsUser), "Needs my reply", "asks", "asks");
      section(page, g, items.filter(a => !F.needsUser(a)), "Running", "running", "running");
    } else if (level === 1) {
      section(page, g, items, "Unread responses", "replies");
      if (isReal() && g.members.some(a => !a.readStateKnown)) page.append($("p", "description", "Read status is unavailable for some threads in this snapshot."));
    } else {
      const board = $("div", "phase-board"); board.setAttribute("aria-label", "Idle threads by phase");
      for (const phase of AgentField.PHASES) section(board, g, items.filter(a => a.phase === phase), AgentField.PHASE_LABELS[phase], "phase-" + phase);
      if (board.children.length) page.append(board);
    }
    page.addEventListener("click", e => { if (i !== pageIdx) { e.stopPropagation(); e.preventDefault(); goPage(i); } }, true);
    return page;
  }
  function drawMinimap() {
    const oldScroll = minimap.querySelector(".mm-matrix")?.scrollLeft || 0;
    minimap.replaceChildren();
    const nav = $("div", "mm-group"), prev = $("button", null, "←"), next = $("button", null, "→"), select = $("select");
    prev.type = next.type = "button"; prev.setAttribute("aria-label", "Previous group"); next.setAttribute("aria-label", "Next group");
    prev.disabled = pageIdx === 0; next.disabled = pageIdx >= groups.length - 1;
    prev.onclick = () => goPage(pageIdx - 1); next.onclick = () => goPage(pageIdx + 1);
    select.setAttribute("aria-label", "Choose group");
    groups.forEach((g, i) => { const o = $("option", null, g.name); o.value = String(i); o.selected = i === pageIdx; select.append(o); });
    select.onchange = () => goPage(Number(select.value)); nav.append(prev, select, next); minimap.append(nav);
    const body = $("div", "mm-body"), labels = $("div", "mm-labels"), matrix = $("div", "mm-matrix");
    LEVELS.forEach((label, level) => {
      const b = $("button", "mm-label" + (lens === level ? " here" : ""), label); b.type = "button"; b.setAttribute("aria-pressed", String(lens === level)); b.onclick = () => goLens(level); labels.append(b);
      const cells = $("div", "mm-cells");
      groups.forEach((g, i) => {
        const count = g.levels[level].length, badge = level === 0 ? g.levels[0].filter(F.needsUser).length : level === 1 ? count : 0;
        const cell = $("button", "mm-cell" + (i === pageIdx ? lens === level ? " lit" : " mark" : "") + (!count ? " empty-cell" : "") + (level === 0 && badge ? " needs-reply" : ""), badge ? String(badge) : "");
        const status = badge ? badge + (level === 0 ? " awaiting your reply" : " unread") : !count ? "Empty" : level === 0 ? "Running" : "";
        cell.type = "button"; cell.title = [g.name, label, status].filter(Boolean).join(" · "); cell.setAttribute("aria-label", cell.title); cell.setAttribute("aria-current", String(i === pageIdx && lens === level));
        if (count && !badge) { const dot = $("i", "presence-dot"); dot.setAttribute("aria-hidden", "true"); cell.append(dot); }
        cell.onclick = () => { goPage(i); goLens(level); }; cells.append(cell);
      }); matrix.append(cells);
    });
    body.append(labels, matrix); minimap.append(body);
    const foot = $("div", "mm-foot"); foot.append($("span", null, "← → groups · ↑ ↓ state"), $("span", null, "g · by " + GROUPING_LABELS[grouping])); minimap.append(foot);
    if (isReal()) minimap.append($("div", "mm-note", "Saved snapshot · Mark read affects this preview only"));
    matrix.scrollLeft = oldScroll;
    const cellLeft = pageIdx * 32;
    if (cellLeft < matrix.scrollLeft) matrix.scrollLeft = cellLeft;
    else if (cellLeft + 28 > matrix.scrollLeft + matrix.clientWidth) matrix.scrollLeft = cellLeft + 28 - matrix.clientWidth;
  }
  function layout(animate) {
    if (!viewport) return;

    signals: {current: ["title", "phase", "summary", "next_action", "next_actor", "created_by", "client", "status", "unread_result", "updated_at", "checkpoint_history"], proposed: ["name", "role", "kind", "activity", "ask", "plan", "target"]},
