<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 26 · Comms matrix</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* Who talks to whom as an adjacency matrix: rows send, columns receive, teams sit as blocks on the diagonal, You first. */
    #stage { padding: 14px 20px 16px; }
    .cm { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) 116px; gap: 10px 16px; min-height: 560px; }
    .cm-bar { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 11px; color: var(--muted); }
    .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .seg .btn { border: 0; padding: 4px 9px; background: transparent; }
    .seg .btn[aria-pressed="true"] { background: var(--tint); color: var(--ink); }
    .cm-bar .lbl { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .cm-bar .grow { flex: 1; }
    .cm-bar .btn.small[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: transparent; }
    .cm-main { grid-column: 1; position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .cm-main svg { display: block; position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
    .cm-strip { grid-column: 1; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-x: auto; }
    .cm-strip .head { flex: none; width: 92px; font-size: 10.5px; line-height: 1.45; color: var(--muted); align-self: center; }
    .cm-strip .head b { display: block; font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .mini { flex: none; display: grid; gap: 3px; justify-items: center; padding: 4px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font: 10px var(--mono); cursor: pointer; }
    .mini:hover { border-color: var(--line-strong); }
    .mini[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .mini canvas { display: block; border-radius: 3px; }

    /* Side panel: needs-you first, then the inspector or the live feed. */
    .cm-side { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; padding-right: 2px; }
    .side-h { display: flex; align-items: baseline; gap: 8px; font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .side-h .warm { color: var(--warm); }
    .side-h .btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: inherit; }
    .needs { display: grid; gap: 6px; }
    .need { border: 1px solid color-mix(in srgb, var(--warm) 35%, var(--line)); border-left: 3px solid var(--warm); border-radius: 6px; background: var(--surface); }
    .need > button.need-sum { all: unset; box-sizing: border-box; width: 100%; display: grid; gap: 2px; padding: 7px 10px; cursor: pointer; font-size: 11.5px; line-height: 1.45; }
    .need > button.need-sum:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .need .path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); }
    .need .path b { color: var(--ink); font-weight: 600; }
    .need .path .you { color: var(--warm); font-weight: 600; }
    .need .q { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .need .k { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--warm); }
    .need.open > button.need-sum { padding-bottom: 2px; }
    .need .ask { border: 0; border-radius: 0 0 6px 0; background: transparent; padding: 2px 10px 9px; }
    .need .ask .ask-kind, .need .ask .ask-question { display: none; }
    .need:hover, .need.lit { border-color: var(--warm); }
    .need.lit { box-shadow: 0 0 0 2px color-mix(in srgb, var(--warm) 25%, transparent); }
    .need-more { justify-self: start; }
    .calm { font-size: 11.5px; color: var(--muted); padding: 8px 10px; border: 1px dashed var(--line-strong); border-radius: 6px; }

    .insp { display: grid; gap: 8px; font-size: 11.5px; line-height: 1.5; }
    .insp-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 550; letter-spacing: -.01em; }
    .insp-head .arrow { color: var(--muted); font-weight: 400; }
    .insp-head .btn { margin-left: auto; }
    .who { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; }
    .who:hover { color: var(--accent); }
    .who:focus-visible { outline: 2px solid var(--accent); }
    .who.assigned { font-style: italic; }
    .sub { color: var(--muted); font-size: 11px; }
    .sub b { color: var(--ink); font-weight: 550; }
    .crumbs { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 10.5px; color: var(--muted); }
    .xchg { border-left: 2px solid var(--line); padding-left: 9px; display: grid; gap: 5px; }
    .xchg.open { border-left-color: var(--line-strong); }
    .msg { display: grid; gap: 1px; }
    .msg small { font: 10px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .msg small .intent { color: var(--ink); }
    .msg small .owed { color: var(--ink); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; }
    .msg small .owed.you { color: var(--warm); border-color: var(--warm); }
    .msg span { color: var(--ink); }
    .msg .reply-row { display: flex; gap: 5px; margin-top: 3px; }
    .msg .reply-row input { flex: 1; min-width: 0; padding: 4px 7px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--ink); font-size: 11px; }
    .partners { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .partners li > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 3px 5px; border-radius: 4px; }
    .partners li > button:hover { background: var(--hover-bg); }
    .partners .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .partners .nm i { color: var(--muted); font-style: normal; font-size: 10.5px; }
    .partners .ct { font: 10px var(--mono); color: var(--muted); }
    .partners .ct .ow { color: var(--ink); }
    .bar-mini { display: inline-block; height: 6px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 55%, var(--surface)); vertical-align: middle; margin-left: 4px; }
    .feed { display: grid; gap: 1px; }
    .feed button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 1px; padding: 5px 7px; border-radius: 5px; font-size: 11px; line-height: 1.4; }
    .feed button:hover { background: var(--hover-bg); }
    .feed .fh { display: flex; gap: 5px; align-items: center; font-size: 10.5px; color: var(--muted); min-width: 0; }
    .feed .fh b { color: var(--ink); font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
    .feed .fh .age { margin-left: auto; font: 10px var(--mono); flex: none; }
    .feed .fb { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed .fresh { animation: arrive 1.6s ease-out; }
    @keyframes arrive { from { background: color-mix(in srgb, var(--accent) 18%, transparent); } }
    .legend { display: grid; gap: 5px; font-size: 10.5px; color: var(--muted); line-height: 1.4; }
    .legend .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid var(--line); }
    .tag { display: inline-block; font: 600 8.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--muted); }
    .tag.proposed { border-style: dashed; }

    /* SVG marks */
    .lab { font-size: 11px; fill: var(--ink); cursor: pointer; }
    .lab.assigned { font-style: italic; }
    .lab.team { font-weight: 600; }
    .lab.dim { opacity: .3; }
    .lab.hot { fill: var(--accent); font-weight: 600; }
    .lab.you { fill: var(--warm); font-weight: 650; }
    .lab-surface { font-size: 10px; fill: var(--muted); pointer-events: none; }
    .cell { shape-rendering: crispEdges; }
    .cell.fresh { animation: cell-arrive 1.8s ease-out; }
    @keyframes cell-arrive { 0% { stroke: var(--accent); stroke-width: 3px; } 100% { stroke-width: 0; } }
    .grid-line { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
    .block { fill: color-mix(in srgb, var(--ink) 4.5%, var(--surface)); stroke: var(--line-strong); stroke-width: 1; shape-rendering: crispEdges; }
    .block.solo { fill: color-mix(in srgb, var(--ink) 2%, var(--surface)); stroke-dasharray: 3 3; }
    .you-band { fill: color-mix(in srgb, var(--warm) 6%, var(--surface)); }
    .cross { fill: none; stroke: var(--accent); stroke-width: 1; opacity: .5; pointer-events: none; }
    .hl { fill: color-mix(in srgb, var(--accent) 9%, transparent); pointer-events: none; }
    .relay { fill: none; stroke: var(--warm); stroke-width: 2; pointer-events: none; }
    .relay-line { fill: none; stroke: var(--warm); stroke-width: 1.4; stroke-dasharray: 3 3; pointer-events: none; opacity: .8; }
    .owed { fill: var(--ink); pointer-events: none; }
    .owed.you { fill: var(--warm); }
    .conflict { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; opacity: .7; }
    .focus-ring { fill: none; stroke: var(--ink); stroke-width: 2; pointer-events: none; }
    .needs-dot { fill: var(--warm); }
    .needs-dot.pulse { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .twisty { font-size: 9px; fill: var(--muted); cursor: pointer; }
    .axis-note { font: 9px var(--mono); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .status { stroke: none; }
    /* Chord view */
    .arc { cursor: pointer; }
    .arc-out { fill: color-mix(in srgb, var(--ink) 22%, var(--surface)); }
    .arc-self { fill: color-mix(in srgb, var(--accent) 75%, var(--surface)); }
    .arc-label .nd { fill: var(--warm); }
    .arc.you .arc-out { fill: var(--warm); }
    .ribbon { fill: color-mix(in srgb, var(--accent) 30%, transparent); stroke: color-mix(in srgb, var(--accent) 50%, transparent); stroke-width: .6; cursor: pointer; transition: opacity .15s; }
    .ribbon.you { fill: color-mix(in srgb, var(--warm) 35%, transparent); stroke: color-mix(in srgb, var(--warm) 60%, transparent); }
    .ribbon.open { stroke: var(--ink); stroke-dasharray: 3 2; stroke-width: .8; }
    .ribbon.fresh { animation: rib-arrive 1.8s ease-out; }
    @keyframes rib-arrive { 0% { fill: color-mix(in srgb, var(--accent) 75%, transparent); } }
    svg.focusing .ribbon:not(.on) { opacity: .12; }
    svg.focusing .arc:not(.on) { opacity: .45; }
    .arc-label { font-size: 10.5px; fill: var(--ink); pointer-events: none; }
    .arc-label.you { fill: var(--warm); font-weight: 650; }
    .arc-label.dim { fill: var(--muted); }

    .tip { position: fixed; z-index: 130; pointer-events: none; max-width: 300px; padding: 7px 9px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 8px 24px var(--shadow); font-size: 11px; line-height: 1.45; color: var(--ink); }
    .tip b { font-weight: 600; }
    .tip .m { color: var(--muted); }
    .tip .q { display: block; margin-top: 3px; color: var(--ink); font-style: italic; }
    @media (prefers-reduced-motion: reduce) { .cell.fresh, .ribbon.fresh, .feed .fresh, .needs-dot.pulse { animation: none; } .ribbon { transition: none; } }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/fixture.js"></script>
<script src="../shared/orchestration.js"></script>
<script src="../shared/mockup.js"></script>
<script>
(() => {
  const $ = (tag, cls, text) => AgentField.el(tag, cls, text);
  const NS = "http://www.w3.org/2000/svg";
  const S = (tag, attrs = {}, cls) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (cls) n.setAttribute("class", cls); return n; };
  const MIN = 60_000, HOUR = 3_600_000;
  const WINDOWS = [["15m", 15 * MIN], ["1h", HOUR], ["6h", 6 * HOUR], ["All", Infinity]];
  const RAMP = [[1, 30], [2, 44], [4, 60], [8, 76], [Infinity, 94]];
  const rampPct = n => n <= 0 ? 0 : RAMP.find(([max]) => n <= max)[1];
  const maxId = field => field.messages.reduce((m, x) => Math.max(m, x.id), 0);
  const trunc = (t, n) => !t ? "" : t.length > n ? t.slice(0, n - 1) + "…" : t;

  /* Identity: the title is the assignment and changes; the axis needs a short, stable handle.
   * Use the reported name; otherwise the app assigns a callsign once, at creation, at no cost to the model. */
  const CALLSIGNS = [
    "Anvil", "Aster", "Birch", "Bluff", "Briar", "Canyon", "Cinder", "Clover", "Copper", "Crane", "Delta", "Dove", "Elm", "Falcon", "Fern", "Flint", "Gale", "Glade",
    "Granite", "Grove", "Hazel", "Hawk", "Iris", "Ivy", "Juno", "Kite", "Lark", "Laurel", "Maple", "Mesa", "Mink", "Nova", "Oak", "Onyx", "Opal", "Otter", "Owl", "Pine",
    "Plover", "Quartz", "Raven", "Reed", "Ridge", "Robin", "Rowan", "Sage", "Shale", "Slate", "Sparrow", "Spruce", "Swift", "Teal", "Thistle", "Thorn", "Tide", "Topaz",
    "Vale", "Willow", "Yew", "Zinnia", "Acorn", "Agate", "Amber", "Arbor", "Ash", "Aspen", "Badger", "Beacon", "Beryl", "Bison", "Bracken", "Brook", "Calder", "Camber",
    "Cassia", "Cedarwood", "Chalk", "Cirrus", "Coral", "Cove", "Cypress", "Dahlia", "Drift", "Dunlin", "Egret", "Eider", "Fable", "Finch", "Fjord", "Flax", "Gannet",
    "Garland", "Geode", "Ginger", "Gorse", "Harrier", "Heath", "Hemlock", "Holly", "Hyacinth", "Ibis", "Jade", "Jay", "Juniperus", "Kelp", "Knoll", "Lagoon", "Larch",
    "Lichen", "Lupine", "Lynx", "Magpie", "Mallow", "Marsh", "Merlin", "Mistral", "Myrtle", "Nimbus", "Oriole", "Osprey", "Pampas", "Petrel", "Pinion", "Poppy",
    "Prairie", "Quail", "Quill", "Rain", "Rill", "Saffron", "Sandpiper", "Sequoia", "Shoal", "Sierra", "Skylark", "Sorrel", "Starling", "Stratus", "Summit", "Sycamore",
    "Tamarack", "Tansy", "Tern", "Thrush", "Timber", "Tundra", "Umber", "Verbena", "Vireo", "Walnut", "Warbler", "Wisteria", "Woodcock", "Yucca", "Zircon", "Aurora",
    "Basalt", "Bluebell", "Caraway", "Comfrey", "Corvid", "Crocus", "Ember", "Fescue", "Foxglove", "Galena", "Heather", "Indigo", "Kingfisher", "Lantana", "Loam",
    "Meadow", "Mosswort", "Nightjar", "Obsidian", "Pewter", "Pumice", "Redwood", "Rosemary", "Russet", "Shingle", "Silt", "Spindle", "Talon", "Thyme", "Upland", "Vetch",
    "Wren"];

  const view = {mode: "matrix", win: null, slice: null, labels: "identity", crossOnly: false, expanded: null, focus: null, needOpen: new Set(), needAll: false, hoverAsk: null};
  let lastField = null, seenMsg = 0, callsigns = new Map(), apiRef = null, tip = null, sizeKey = "";

  function resetFor(field) {
    lastField = field; seenMsg = maxId(field); callsigns = new Map(); view.focus = null; view.needOpen = new Set(); view.needInit = false;
    view.win ??= field.scale === "small" ? 6 * HOUR : HOUR;
    view.expanded = new Set(field.scale === "large" ? [] : field.roots().map(r => r.id).concat("solo"));
  }
  function callsign(field, a) {
    if (!callsigns.size || !callsigns.has(a.id)) {
      const taken = new Set(field.agents.map(x => x.name).filter(Boolean));
      for (const v of callsigns.values()) taken.add(v);
      for (const x of [...field.agents].sort((p, q) => p.createdAt - q.createdAt || (p.id < q.id ? -1 : 1))) {
        if (x.name || callsigns.has(x.id)) continue;
        let h = 0; for (const ch of x.id + x.title) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        let name = null;
        for (let k = 0; k < CALLSIGNS.length && !name; k++) { const w = CALLSIGNS[(h + k) % CALLSIGNS.length]; if (!taken.has(w)) name = w; }
        for (let k = 2; !name; k++) { const w = CALLSIGNS[h % CALLSIGNS.length] + " " + k; if (!taken.has(w)) name = w; }
        taken.add(name); callsigns.set(x.id, name);
      }
    }
    return callsigns.get(a.id);
  }
  const identity = (field, a) => !a ? "You" : view.labels === "title" ? a.title : (a.name || callsign(field, a));
  const assigned = a => a && view.labels !== "title" && !a.name;
  const surfaceOf = a => a.surface ? a.surface.kind + " · " + a.surface.label : (a.scope[0] || "");

  /* Axis units: You, then each team (root + tree), solo agents grouped in one block. A collapsed team is one unit. */
  function buildAxis(field) {
    const roots = field.roots();
    const teams = [], solos = [];
    for (const r of roots) { const members = [r, ...field.descendants(r.id)]; if (members.length > 1) teams.push({key: r.id, root: r, members}); else solos.push(r); }
    if (solos.length) teams.push({key: "solo", root: null, members: solos, solo: true});
    const units = [{type: "you", key: "user", ids: ["user"], team: null}];
    const teamOf = new Map([["user", null]]);
    for (const t of teams) {
      t.start = units.length;
      for (const m of t.members) teamOf.set(m.id, t);
      if (view.expanded.has(t.key)) {
        const rows = t.solo ? solos.map(a => ({agent: a, depth: 0})) : field.treeRows([t.root.id]);
        for (const {agent, depth} of rows) units.push({type: "agent", key: agent.id, ids: [agent.id], agent, depth, team: t});
      } else units.push({type: "team", key: "team:" + t.key, ids: t.members.map(m => m.id), team: t});
      t.end = units.length;
    }
    const unitOf = new Map(); units.forEach((u, i) => { for (const id of u.ids) unitOf.set(id, i); });
    return {units, teams, unitOf, teamOf};
  }
  function windowRange(field) {
    if (view.slice != null) return {from: field.now - (view.slice + 1) * 10 * MIN, to: field.now - view.slice * 10 * MIN, label: view.slice ? (view.slice + 1) * 10 + "–" + view.slice * 10 + " min ago" : "the last 10 min"};
    const w = WINDOWS.find(x => x[1] === view.win);
    return {from: view.win === Infinity ? -Infinity : field.now - view.win, to: Infinity, label: view.win === Infinity ? "all time" : "the last " + w[0]};
  }
  /* Directed counts per unit pair. Pending asks count as an open message to You (agent-coord has no ask-to-user message today). */
  function aggregate(field, axis, range) {
    const cells = new Map(), key = (i, j) => i * 4096 + j;
    const get = (i, j) => { const k = key(i, j); let c = cells.get(k); if (!c) cells.set(k, c = {i, j, count: 0, msgs: [], open: 0, youOpen: 0, asks: [], fresh: false, last: null}); return c; };
    for (const m of field.messages) {
      if (m.at < range.from || m.at > range.to) continue;
      const i = axis.unitOf.get(m.from), j = axis.unitOf.get(m.to); if (i == null || j == null) continue;
      const c = get(i, j); c.count++; c.msgs.push(m); c.last = m; if (m.id > seenMsg) c.fresh = true;
    }
    for (const m of field.openRequests()) {
      const i = axis.unitOf.get(m.from), j = axis.unitOf.get(m.to); if (i == null || j == null) continue;
      const c = get(i, j); if (m.to === "user") c.youOpen++; else c.open++;
    }
    for (const a of field.asks()) { const i = axis.unitOf.get(a.id); if (i == null) continue; const c = get(i, 0); c.asks.push(a); c.youOpen++; }
    return cells;
  }
  const intentsOf = msgs => { const t = {}; for (const m of msgs) t[m.intent] = (t[m.intent] || 0) + 1; return Object.entries(t).sort((a, b) => b[1] - a[1]); };
  const intentText = (field, msgs) => intentsOf(msgs).map(([k, n]) => n + " " + (field.INTENT_LABELS[k] || k).toLowerCase()).join(", ");

  function hexToRgb(h) { h = h.trim(); if (h.length === 4) h = "#" + [...h.slice(1)].map(c => c + c).join(""); const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const mix = (a, b, p) => "rgb(" + a.map((v, k) => Math.round(v * p / 100 + b[k] * (1 - p / 100))).join(",") + ")";

  Mockup.mount({
    number: 26, title: "Comms matrix", spectrum: "radical",
    summary: "Who talks to whom at any scale: an adjacency matrix with teams as diagonal blocks and You as the first row and column, a chord view by team, and small multiples of the last hour.",
    signals: {
      current: ["agent_messages", "creation", "created_by", "conflicts", "status", "title", "phase", "write_scope", "pending_approval", "next_actor", "updated_at"],
      proposed: ["name", "intent", "surface", "escalation", "ask", "role", "blocks"],
    },
    notes: "Identity: the title is the assignment and changes, and it is too long for an axis, so rows use the reported name and otherwise an app-assigned callsign (italic) given once at creation; the title stays in the hover and inspector. On what: the surface (page, service, doc…) is shown under each identity and phase is left to the drawer, because phase says how far, not on what; without the proposed surface the label falls back to the first write-scope path. Cost to the model: nothing for the matrix itself (agent-coord messages, created_by, and conflicts exist today); intent on send, a surface noun on the checkpoint, and ask.via on escalation are one field each. Pending asks are shown as open messages to You because today an ask is not an agent-coord message.",
    render(field, stage, api) {

      if (field !== lastField) resetFor(field);

      if (m.replyRequired && !m.repliedBy) fh.append($("span", "tag", "reply owed"));
      fh.append($("span", "age", field.relativeTime(m.at).replace(" ago", "")));
      b.append(fh, $("span", "fb", m.body)); b.title = m.body;
      b.onclick = () => { for (const id of [m.from, m.to]) { const r = id !== "user" && field.chain(id)[0]; if (r) view.expanded.add(field.children(r.id).length ? r.id : "solo"); } view.focus = {cell: [m.from, m.to]}; apiRef.rerender(); };
      feed.append(b);
    }
    host.append(feed);
    const lg = $("div", "legend"); host.append($("div", "side-h", "Reading the matrix"), lg);
    const sw = p => { const s = $("span", "sw"); s.style.background = `color-mix(in srgb, var(--accent) ${p}%, var(--surface))`; return s; };
    const r1 = $("div", "row"); r1.append(...RAMP.map(([, p]) => sw(p)), "1 → 9+ messages, row sends to column"); lg.append(r1);
    const r2 = $("div", "row"); const w = $("span", "sw"); w.style.background = "color-mix(in srgb, var(--warm) 60%, var(--surface))"; r2.append(w, "to or from You · a pending ask is an open request in your column"); lg.append(r2);
    const r3 = $("div", "row"); r3.append($("span", "tag", "◥"), "reply owed (warm when you owe it)", $("span", "tag", "┄"), "write scopes overlap"); lg.append(r3);
    const r4 = $("div", "row"); r4.append("Grey squares on the diagonal are teams; anything outside them is cross-team. ", $("i", null, "Italic"), " names are app-assigned callsigns."); lg.append(r4);
  }

  /* ---------- tooltips ---------- */
  function showTip(e, content) { if (!content) return hideTip(); tip.replaceChildren(...content); tip.hidden = false; moveTip(e); }
  function moveTip(e) { if (tip.hidden) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
  function hideTip() { if (tip) tip.hidden = true; }
  function labelTip(field, u) {
    if (u.type === "you") return [$("b", null, "You"), $("span", "m", " · row: what you sent · column: what reached you")];
    if (u.type === "team") { const nd = u.team.members.filter(field.needsUser).length; return [$("b", null, u.team.solo ? "Solo agents" : identity(field, u.team.root) + "’s team"), $("span", "m", " · " + u.team.members.length + " agents" + (nd ? " · " + nd + " need you" : "") + " · click to unfold")]; }
    const a = u.agent;
    return [$("b", null, identity(field, a)), $("span", "m", " · " + (AgentField.ROLE_LABELS[a.role] || a.role) + " · " + field.statusLabel(a)), $("span", "q", a.title), $("span", "m", (a.surface ? a.surface.kind + ": " + a.surface.label : a.scope[0] || "") + (a.activity && a.status === "working" ? " · " + a.activity : ""))];
  }
  function cellTip(field, axis, cells, i, j) {
    const c = cells.get(i * 4096 + j), back = cells.get(j * 4096 + i);
    const ui = axis.units[i], uj = axis.units[j];
    const out = [$("b", null, unitLabel(field, ui)), $("span", "m", i === j ? " · within" : " → "), i === j ? "" : $("b", null, unitLabel(field, uj))];
    if (!c?.count && !c?.asks.length) out.push($("span", "q", "No messages this way" + (back?.count ? "; " + back.count + " came back the other way." : ".")));
    else {
      if (c.count) out.push($("span", "m", " · " + c.count + " msg: " + intentText(field, c.msgs)));
      if (c.last) out.push($("span", "q", "“" + trunc(c.last.body, 110) + "” · " + field.relativeTime(c.last.at)));
      for (const a of c.asks.slice(0, 2)) out.push($("span", "q", "Asks you: " + trunc(a.ask.question, 90)));
      if (c.open) out.push($("span", "m", (c.open === 1 ? "1 reply owed" : c.open + " replies owed") + " by " + unitLabel(field, uj)));
      if (back?.count && i !== j) out.push($("span", "m", " · " + back.count + " back"));
    }
    return out;
  }
  function teamPairTip(field, axis, cells, i, j) {
    const a = cells.get(i * 4096 + j), b = cells.get(j * 4096 + i), msgs = [...(a?.msgs || []), ...(b?.msgs || [])];
    return [$("b", null, unitLabel(field, axis.units[i])), $("span", "m", " ⇄ "), $("b", null, unitLabel(field, axis.units[j])),
      $("span", "m", " · " + msgs.length + " msg" + ((a?.asks.length || b?.asks.length) ? " + " + ((a?.asks.length || 0) + (b?.asks.length || 0)) + " asks" : "")), msgs.length ? $("span", "q", intentText(field, msgs)) : ""];
  }
  function arcTip(field, u, self, vol, asks) {
    if (u.type === "you") return [$("b", null, "You"), $("span", "m", " · " + field.asks().length + " asks waiting")];
    return [$("b", null, u.team.solo ? "Solo agents" : identity(field, u.team.root) + "’s team"), $("span", "m", " · " + u.team.members.length + " agents · " + self + " msgs inside · " + (vol - self) + " with other teams" + (asks ? " · " + asks + " asks to you" : ""))];
  }
})();
</script>
