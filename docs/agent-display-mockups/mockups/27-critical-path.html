<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 27 · Critical path</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* The user as a node in the dependency graph, laid out vertically: each outcome on top, what it waits on
       below, deeper waits further down, and You at the bottom of every chain that ends on you. Messages are
       dots that float along the edges. */
    .cp-head { display: grid; gap: 6px; max-width: 1000px; margin-bottom: 12px; }
    .cp-headline { font-size: 19px; line-height: 1.4; letter-spacing: -.02em; font-weight: 450; }
    .cp-headline b { font-weight: 650; }
    .cp-headline .you { color: var(--warm); }
    .cp-headline .calm { color: var(--ok); }
    .cp-sub { font-size: 13px; color: var(--muted); line-height: 1.5; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
    .cp-sub .chain { color: var(--ink); }
    .cp-sub .chain i { font-style: normal; color: var(--muted); margin: 0 3px; }
    .cp-hint { font-size: 11px; color: var(--muted); margin: -4px 0 10px; }
    .cp-hint code { font: 10.5px var(--mono); color: var(--ink); }
    .cp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 4px 0 10px; font-size: 11px; color: var(--muted); }
    .cp-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
    .cp-seg .btn { border: 0; border-radius: 0; }
    .cp-seg .btn + .btn { border-left: 1px solid var(--line); }
    .cp-legend { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .cp-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .cp-legend svg { width: 22px; height: 10px; overflow: visible; }

    /* Replay: a time cursor sweeps the message log and launches a dot per message. */
    .cp-replay { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 11px; color: var(--muted); }
    .cp-replay .btn { flex: none; }
    .cp-replay select { font-size: 11px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); }
    .cp-scrub { position: relative; flex: 1 1 320px; min-width: 220px; height: 30px; }
    .cp-scrub svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cp-scrub svg rect { fill: color-mix(in srgb, var(--accent) 45%, transparent); }
    .cp-scrub svg rect.warm { fill: color-mix(in srgb, var(--warm) 70%, transparent); }
    .cp-scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
    .cp-scrub .cursor { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); border-radius: 1px; pointer-events: none; }
    .cp-replay .live { flex: none; font: 600 9px var(--mono); letter-spacing: .08em; color: var(--ok); margin-left: -6px; }
    .cp-replay .derived { flex: 0 1 auto; }
    .cp-replay .clock { font: 11px var(--mono); color: var(--ink); min-width: 118px; }
    .cp-replay .derived { font-size: 10px; }

    .cp-section { flex: 0 0 100%; font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 0 0; display: flex; gap: 10px; align-items: baseline; }
    .cp-section small { font: 11px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; text-transform: none; }
    .cp-board { position: relative; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 16px; }

    /* A team is a vertical tree: outcome on top, rows of deeper waits, You at the bottom. */
    .cp-team { position: relative; display: flex; flex-direction: column; align-items: stretch; min-width: 290px; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--surface) 55%, var(--paper)); }
    .cp-team.moving { background: transparent; border-style: dashed; }
    .cp-team-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .cp-team-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: -.01em; min-width: 0; max-width: 100%; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; }
    .cp-team-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-team-name:hover span { text-decoration: underline; text-underline-offset: 2px; }
    .cp-eta { font: 11px var(--mono); color: var(--muted); }
    .cp-eta.you { color: var(--warm); font-weight: 600; }
    .cp-eta.ext { color: var(--ink); }
    .cp-team-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 10px; color: var(--muted); align-items: center; margin-left: auto; }
    .cp-team-meta .btn { padding: 1px 6px; font-size: 10px; }
    .cp-rows { display: flex; flex-direction: column; gap: 30px; align-items: center; }
    .cp-row { display: flex; justify-content: center; align-items: flex-start; gap: 12px; flex-wrap: nowrap; }
    .cp-you { margin-top: 30px; padding: 8px; border-radius: 9px; background: color-mix(in srgb, var(--warm-tint) 75%, var(--paper)); border: 1px solid color-mix(in srgb, var(--warm) 28%, var(--line)); display: grid; gap: 8px; }
    .cp-you > h4 { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--warm); display: flex; justify-content: space-between; }
    .cp-you > h4 small { font: 10px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 400; }
    .cp-you-cards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

    /* Nodes: identity, surface, and the wait or estimate. */
    .cp-node { position: relative; z-index: 2; display: grid; gap: 3px; width: 196px; padding: 7px 9px; text-align: left; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; font-size: 11px; line-height: 1.35; transition: opacity .2s, border-color .15s, box-shadow .15s; }
    .cp-node:hover, .cp-node:focus-visible { border-color: var(--hover-line); box-shadow: 0 4px 14px var(--shadow); }
    .cp-node.crit { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
    .cp-node.crit.stalled { border-color: color-mix(in srgb, var(--warm) 60%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warm) 22%, transparent); }
    .cp-node.needs { border-bottom: 3px solid var(--warm); }
    .cp-node.fade { opacity: .45; }
    .cp-node.fade:hover { opacity: 1; }
    .cp-node .id { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .cp-node .id .provider-logo { width: 12px; height: 12px; }
    .cp-node .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 12px; letter-spacing: -.01em; }
    .cp-node .nm.is-title { font-weight: 500; text-decoration: underline dotted color-mix(in srgb, var(--muted) 60%, transparent); text-underline-offset: 3px; }
    .cp-node .on { display: flex; gap: 5px; align-items: baseline; min-width: 0; color: var(--ink); }
    .cp-node .on .k { flex: none; font: 600 8.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .cp-node .on .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .cp-node .on .v.mono { font-size: 10px; color: var(--muted); }
    .cp-node .st { display: flex; gap: 6px; align-items: center; font-size: 10px; color: var(--muted); min-width: 0; overflow: hidden; }
    .cp-node .st .eta { font-family: var(--mono); color: var(--ink); white-space: nowrap; }
    .cp-node .st .eta.you { color: var(--warm); font-weight: 600; }
    .cp-node .st .chip { padding: 0 5px; font-size: 9px; line-height: 1.45; }
    .cp-node .st .chip.slip { color: var(--ink); border-style: dashed; }
    .cp-node .st .act { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--accent); }
    .cp-node .role { margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; color: var(--muted); }
    .cp-node .act + .role { display: none; }
    .cp-node.compact { width: 160px; padding: 5px 8px; gap: 2px; }
    .cp-node.compact .nm { font-size: 11px; }
    .cp-node.arrive { animation: cp-arrive .7s ease-out; }
    @keyframes cp-arrive { 0% { box-shadow: 0 0 0 0 var(--pulse, color-mix(in srgb, var(--accent) 60%, transparent)); } 100% { box-shadow: 0 0 0 10px transparent; } }
    .cp-ext { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; max-width: 196px; padding: 4px 9px; border: 1px dashed var(--line-strong); border-radius: 12px; font-size: 10px; color: var(--muted); background: var(--paper); }
    .cp-ext span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-ext.crit { border-color: var(--accent); color: var(--ink); }

    /* Asks at the bottom of the tree, ranked across the whole field. */
    .cp-ask { position: relative; z-index: 2; display: grid; gap: 4px; width: 272px; }
    .cp-ask .path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
    .cp-ask .path b { color: var(--ink); font-weight: 600; cursor: pointer; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-ask .path b:hover { text-decoration: underline; }
    .cp-ask .path .you { color: var(--warm); font-weight: 700; }
    .cp-ask .rank { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--warm); color: var(--surface); font: 700 10px var(--mono); margin-right: 3px; }
    :root[data-theme="dark"] .cp-ask .rank { color: var(--paper); }
    .cp-ask .rank.first { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warm) 25%, transparent); }
    .cp-ask .unblocks { font-size: 10px; color: var(--muted); line-height: 1.4; }
    .cp-ask .unblocks b { color: var(--ink); font-weight: 600; }
    .cp-ask .ask { padding: 8px 10px; font-size: 11.5px; line-height: 1.45; }
    .cp-ask .ask .ask-impact { display: none; }
    .cp-ask .ask .ask-options { margin-top: 6px; gap: 5px; }
    .cp-ask .ask > .btn.quiet { padding: 2px 0 0; }
    .cp-ask .ask-question { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .cp-ask.compact .ask-question { -webkit-line-clamp: 2; }
    .cp-ask.compact .ask > .btn.quiet { display: none; }
    .cp-ask .real-actions { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .cp-ask.flash .ask { animation: cp-flash 1.2s ease-out; }
    @keyframes cp-flash { 0%, 40% { box-shadow: 0 0 0 3px var(--warm); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .cp-next { font-size: 11px; line-height: 1.45; border-left: 3px solid var(--warm); padding: 6px 9px; border-radius: 5px; background: var(--surface); }
    .cp-next b { color: var(--warm); font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; display: block; }

    /* Edges */
    .cp-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
    .cp-edges path.e { fill: none; stroke: var(--line-strong); stroke-width: 1.2; opacity: .8; }
    .cp-edges path.e.reply { stroke-dasharray: 5 4; }
    .cp-edges path.e.handoff { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
    .cp-edges path.e.external { stroke-dasharray: 2 3; }
    .cp-edges path.e.you { stroke: color-mix(in srgb, var(--warm) 55%, var(--line-strong)); }
    .cp-edges path.e.back, .cp-edges path.e.cross { opacity: .4; }
    .cp-edges path.e.crit { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
    .cp-edges path.e.crit.you, .cp-edges path.e.crit.stalled { stroke: var(--warm); }
    .cp-edges text { font: 9.5px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
    .cp-edges text.crit { fill: var(--ink); }
    .cp-edges text.you { fill: var(--warm); font-weight: 600; }
    .cp-edges marker path { fill: var(--line-strong); }
    .cp-edges marker.crit path { fill: var(--accent); }
    .cp-edges marker.warm path { fill: var(--warm); }
    /* Open requests wait at the recipient as hollow, slowly pulsing dots. */
    .cp-edges .owed { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 2.2 1.6; animation: cp-owed 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cp-edges .owed.warm { stroke: var(--warm); }
    .cp-edges .owed-n { font: 600 8.5px var(--mono); fill: var(--ink); stroke: none; }
    @keyframes cp-owed { 50% { transform: scale(1.35); opacity: .6; } }
    .cp-board.hovering .cp-node:not(.hl), .cp-board.hovering .cp-ext:not(.hl) { opacity: .25; }
    .cp-board.hovering .cp-ask:not(.hl) { opacity: .5; }
    .cp-board.hovering path.e:not(.hl), .cp-board.hovering .cp-edges text:not(.hl) { opacity: .08; }
    .cp-board.hovering path.e.hl { opacity: 1; stroke-width: 2.2; }
    .cp-board.hovering .cp-node.hl { opacity: 1; }

    /* Message dots live in a fixed overlay so they survive re-renders. */
    .cp-dots { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; overflow: visible; }
    .cp-dots circle { fill: var(--accent); }
    .cp-dots circle.warm { fill: var(--warm); }
    .cp-dots circle.ok { fill: var(--ok); }
    .cp-dots circle.open { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
    .cp-dots circle.open.warm { stroke: var(--warm); }
    .cp-dots circle.open.ok { stroke: var(--ok); }
    .cp-dots circle.trail { opacity: .35; }

    .cp-settled { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 18px; font-size: 11px; color: var(--muted); }
    .cp-settled .btn { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-settled h4 { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
    @media (prefers-reduced-motion: reduce) { .cp-node, .cp-node.arrive, .cp-ask.flash .ask, .cp-edges .owed { animation: none; transition: none; } }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/real-threads.js"></script>
<script src="../shared/fixture.js"></script>
<script src="../shared/orchestration.js"></script>
<script src="../shared/mockup.js"></script>
<script>
"use strict";
(() => {
  const $ = AgentField.el, MIN = 60_000, HOUR = 3_600_000, EXT_MIN = 15, NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // View state that survives re-renders.
  const view = {mode: null, expanded: new Set(), hover: null, seenMsg: null, rects: new Map(), lastKey: null, flash: null,
    replay: {on: !reduced, speed: 1, win: 24 * HOUR, cursor: null, ptr: 0, hold: 0, scrubbing: false}};

  const nameOf = a => a.name || a.title;
  const fmt = m => m === Infinity ? "stalled on you" : m < 1 ? "<1m" : m < 60 ? "~" + Math.round(m) + "m" : "~" + Math.floor(m / 60) + "h " + String(Math.round(m % 60)).padStart(2, "0") + "m";
  const ago = (field, t) => field.duration(Math.max(0, field.now - t));
  const ROLE_SHORT = {orchestrator: "orchestrator", implementer: "implementer", reviewer: "reviewer", researcher: "researcher", releaser: "releaser", dispatcher: "dispatcher", subagent: "subagent", delegate: "delegate"};
  const isReal = field => field.scenario === "real";
  const snapshot = globalThis.AGENT_COORD_SNAPSHOT;
  let api = null;

  /* The dependency graph. An edge waiter → dependency comes from four places:
       waitingOn (proposed; agent or external), an ask or next_actor=user (→ You),
       an open reply_required request (today: the sender waits on the recipient's reply),
       and an unanswered creation (today: the creator waits on the child's handoff). With real records, creation
       lineage adds one more: a live creator waits on each child that is still working, waiting, or failed. */
  function buildGraph(field) {
    const out = new Map(), into = new Map(), nodes = new Map();
    const node = (id, extra) => { if (!nodes.has(id)) nodes.set(id, {id, ...extra}); return nodes.get(id); };
    const live = a => a && a.status !== "done";
    const add = (from, to, kind, since, msg) => {
      if (from === to) return;
      if (!out.has(from)) out.set(from, new Map());
      const m = out.get(from); let e = m.get(to);
      if (!e) { e = {from, to, kinds: new Set(), since, msgs: []}; m.set(to, e); if (!into.has(to)) into.set(to, []); into.get(to).push(e); }
      e.kinds.add(kind); e.since = Math.min(e.since, since); if (msg) e.msgs.push(msg);
    };
    node("user", {type: "user"});
    for (const a of field.agents) {
      if (!live(a)) continue;
      node(a.id, {type: "agent", agent: a});
      for (const w of a.waitingOn) {
        if (w.startsWith("external:")) { const id = "ext:" + a.id + ":" + w.slice(9); node(id, {type: "ext", label: w.slice(9), owner: a.id}); add(a.id, id, "external", a.updatedAt); }
        else if (live(field.byId(w))) add(a.id, w, "waits", a.updatedAt);
      }
      if (field.needsUser(a)) add(a.id, "user", a.ask ? "ask" : "next", a.ask?.askedAt ?? a.updatedAt);
      if (isReal(field)) for (const k of field.children(a.id)) if (["working", "waiting", "failed", "blocked"].includes(k.status)) add(a.id, k.id, "lineage", k.createdAt);
    }
    for (const m of field.openRequests()) {
      if (m.from === "user") continue;
      const from = field.byId(m.from); if (!live(from)) continue;
      if (m.to === "user") { add(m.from, "user", "request", m.at, m); continue; }
      if (!live(field.byId(m.to))) continue;
      add(m.from, m.to, m.kind === "creation" ? "handoff" : "reply", m.at, m);
    }
    const deps = id => [...(out.get(id)?.values() || [])];
    const waiters = id => into.get(id) || [];

    // Levels: sinks (working agents, externals) are 0, You is -1, everyone else is 1 + their deepest dependency.
    // A request that closes a loop is kept as a back edge and drawn faintly; it does not set the level.
    const level = new Map([["user", -1]]), state = new Map();
    const visit = id => {
      if (level.has(id) && state.get(id) !== 1) return level.get(id);
      state.set(id, 1); let L = 0, any = false;
      for (const e of deps(id)) {
        if (state.get(e.to) === 1) { e.back = true; continue; }
        any = true; L = Math.max(L, visit(e.to) + 1);
      }
      if (!any) L = 0;
      // An agent whose only dependency is You sits next to the rail.
      if (any && deps(id).every(e => e.to === "user" || e.back)) L = 0;
      state.set(id, 2); level.set(id, L); return L;
    };
    // Visit from the roots first so loops break at the most recent request, not at the delegation.
    const order = [...nodes.keys()].filter(id => id !== "user").sort((x, y) => (field.byId(x) ? field.depth(x) : 9) - (field.byId(y) ? field.depth(y) : 9));
    for (const id of order) visit(id);

    // Estimates: own remaining work from plan progress and pace; finish = own + latest dependency.
    const own = a => {
      if (isReal(field)) return 1; // no plan steps in real records: count hops instead of minutes
      // Delegated steps are counted through the child's own finish, so only the agent's own steps count here.
      const p = field.progress(a), elapsed = Math.max(1, (field.now - a.createdAt) / MIN);
      const pace = p.done ? Math.min(20, Math.max(4, elapsed / p.done)) : 12;
      const left = Math.max(1, a.plan.filter(s => s.state !== "done" && s.state !== "delegated").length);
      return a.status === "working" ? left * pace : left * pace * .5;
    };
    const finishWith = userMin => {
      const memo = new Map();
      const f = id => {
        if (id === "user") return userMin;
        if (memo.has(id)) return memo.get(id);
        memo.set(id, 0);
        const n = nodes.get(id); let v;
        if (n.type === "ext") v = EXT_MIN;
        else { let d = 0; for (const e of deps(id)) if (!e.back) d = Math.max(d, f(e.to)); v = own(n.agent) + d; }
        memo.set(id, v); return v;
      };
      return f;
    };
    const finish = finishWith(Infinity), after = finishWith(0);

    // Who you block: every agent that reaches You through any chain.
    const reach = new Map();
    const reachesUser = id => {
      if (id === "user") return true; if (reach.has(id)) return reach.get(id);
      reach.set(id, false); const r = deps(id).some(e => !e.back && reachesUser(e.to)); reach.set(id, r); return r;
    };
    for (const id of nodes.keys()) reachesUser(id);

    // Longest chain of waiters behind an agent (upstream), for ranking asks.
    const upMemo = new Map();
    const up = id => {
      if (upMemo.has(id)) return upMemo.get(id);
      upMemo.set(id, {len: 1, path: [id]});
      let best = {len: 1, path: [id]};
      for (const e of waiters(id)) { if (e.back) continue; const u = up(e.from); if (u.len + 1 > best.len) best = {len: u.len + 1, path: [...u.path, id]}; }
      upMemo.set(id, best); return best;
    };
    const upstream = id => { const seen = new Set(), stack = [id]; while (stack.length) { const x = stack.pop(); for (const e of waiters(x)) if (!e.back && !seen.has(e.from)) { seen.add(e.from); stack.push(e.from); } } return seen; };

    return {nodes, out, deps, waiters, level, finish, after, reachesUser: id => reach.get(id), up, upstream};
  }

  // The chain that finishes last: from a root, always follow the dependency with the latest finish.
  function criticalPath(g, rootId) {
    const path = [rootId], edges = [];
    let cur = rootId; const seen = new Set([rootId]);
    while (true) {

    const r = view.replay, bar = $("div", "cp-replay");

    play.onclick = () => { r.on = !r.on; if (r.on && r.cursor >= field.now) resetReplay(field); play.textContent = r.on ? "❚❚ Replay" : "▶ Replay"; };
    const seg = $("div", "cp-seg");
    for (const [w, l] of [[HOUR, "1 h"], [24 * HOUR, "24 h"], [7 * 24 * HOUR, "7 d"]]) { const b = $("button", "btn small", l); b.type = "button"; b.setAttribute("aria-pressed", String(r.win === w)); b.onclick = () => { r.win = w; resetReplay(field); field.emit(); }; seg.append(b); }
    const speed = $("select"); speed.title = "Replay speed";
    for (const s of [.5, 1, 2, 4]) { const o = $("option", null, s + "×"); o.value = s; o.selected = r.speed === s; speed.append(o); }
    speed.onchange = () => { r.speed = Number(speed.value); };
    const clock = $("span", "clock");
    const scrub = $("div", "cp-scrub"), hist = document.createElementNS(NS, "svg");
    hist.setAttribute("viewBox", "0 0 120 30"); hist.setAttribute("preserveAspectRatio", "none");
    const from = field.now - r.win, buckets = new Array(120).fill(0), warmB = new Array(120).fill(0);
    for (let i = seek(field, from); i < field.messages.length; i++) { const m = field.messages[i]; const k = Math.min(119, Math.floor((m.at - from) / r.win * 120)); if (k < 0) continue; buckets[k]++; if (dotClass(m).includes("warm")) warmB[k]++; }
    const peak = Math.max(1, ...buckets);
    buckets.forEach((n, i) => { if (!n) return; const h = Math.max(1.5, n / peak * 26); const rc = document.createElementNS(NS, "rect"); rc.setAttribute("x", i + .1); rc.setAttribute("width", .8); rc.setAttribute("y", 30 - h); rc.setAttribute("height", h); if (warmB[i] / n > .4) rc.setAttribute("class", "warm"); hist.append(rc); });
    const cursor = $("span", "cursor"), input = $("input"); input.type = "range"; input.min = 0; input.max = 1000; input.setAttribute("aria-label", "Replay position");
    input.oninput = () => { r.scrubbing = true; r.cursor = from + Number(input.value) / 1000 * r.win; r.ptr = seek(field, r.cursor); r.hold = 0; updateScrub(field); };
    input.onchange = () => { r.scrubbing = false; };
    scrub.append(hist, cursor, input);
    const total = field.messages.length - seek(field, from);
    const info = $("span", "derived", total + " messages" + (isReal(field) ? " · real records · intent guessed from text" : " · simulated") + (field.outsideMessages ? " · " + field.outsideMessages + " with threads outside this view" : ""));
    const live = $("span", "live", "● LIVE"); live.title = "Open requests wait at their recipient as hollow pulsing dots";
    bar.append(play, seg, speed, clock, scrub, live, info);
    bar.dataset.from = from;
    return bar;
  }
  function updateScrub(field) {
    const r = view.replay, bar = document.querySelector(".cp-replay"); if (!bar) return;
    const from = Number(bar.dataset.from), p = Math.max(0, Math.min(1, (r.cursor - from) / r.win));
    const cur = bar.querySelector(".cursor"); if (cur) cur.style.left = `calc(${(p * 100).toFixed(2)}% - 1px)`;
    const input = bar.querySelector("input"); if (input && !r.scrubbing) input.value = Math.round(p * 1000);
    const clock = bar.querySelector(".clock");
    if (clock) { const d = new Date(r.cursor); clock.textContent = r.cursor >= field.now - 1000 ? "live · now" : d.toLocaleString([], {weekday: r.win > 24 * HOUR ? "short" : undefined, hour: "2-digit", minute: "2-digit"}) + " · −" + field.duration(field.now - r.cursor); }
  }

  // Mount last: render runs immediately and needs everything above.
  api = Mockup.mount({
    number: 27, title: "Critical path", spectrum: "radical", defaultScale: snapshot ? "real" : "small", projectTabs: true,
    summary: "You as a node in the dependency graph, top to bottom: each outcome, what it waits on, and you at the end of the chains; messages float along the edges.",
    signals: {
      current: ["title", "status", "created_by", "creation", "agent_messages", "next_actor", "next_action", "pending_approval", "write_scope", "updated_at", "age", "tool_activity", "phase", "client"],
      proposed: ["name", "role", "surface", "intent", "waiting_on", "ask", "escalation", "blocks", "health", "plan", "eta"],
    },
    notes: "With real records the graph is built only from what agent-coord already stores: creation lineage (a live creator waits on its live children), unanswered creations and reply_required messages (the sender waits on the recipient), and next_actor=user checkpoints (the agent waits on you); message kinds come from the database and intent is guessed from the text. waiting_on, a structured ask and plan steps would make it exact and add time estimates (simulated scales show them). Identity: the title is the assignment and changes, so a node leads with a stable name and shows the title underlined as a placeholder until one is reported. On what: the surface (one checkpoint field), else the first write-scope path; phase moves to the tooltip.",
    render(field, stage, apiRef) {
      api = apiRef;
      const key = field.scale + "|" + (field.workspace || "");
      if (view.lastKey !== key) { view.mode = null; view.expanded.clear(); view.seenMsg = null; view.rects.clear(); view.lastKey = key; resetReplay(field); }
      if (field.messages.length && view.seenMsg !== null && field.messages.at(-1).id < view.seenMsg) { view.seenMsg = null; resetReplay(field); } // after Reset
      const real = isReal(field), large = field.scale === "large" || field.agents.length > 120;
      view.mode ??= "critical";
      const all = view.mode === "all";

      // Remember node positions for the reflow animation.
      const oldBoard = stage.querySelector(".cp-board");
      if (oldBoard) { const br = oldBoard.getBoundingClientRect(); view.rects = new Map([...oldBoard.querySelectorAll("[data-id]")].map(el => { const r = el.getBoundingClientRect(); return [el.dataset.id, {x: r.left - br.left, y: r.top - br.top}]; })); }
      stage.replaceChildren();
      const A = analyse(field);

      /* Headline: what you block, and which answer unblocks the longest chain. */
      const head = $("div", "cp-head"), hl = $("p", "cp-headline"), sub = $("div", "cp-sub");
      const top = A.holders[0];
      if (A.blockedByYou.length) {
        hl.append("You are blocking ", $("b", "you", A.blockedByYou.length + (A.blockedByYou.length === 1 ? " agent" : " agents")), " across ", $("b", null, A.blockedTeams.size + (A.blockedTeams.size === 1 ? " team" : " teams")), ". ");
        if (top) {
          const kind = top.agent.ask ? (real ? "next step" : top.agent.ask.kind) : "next step";
          hl.append("Answering ", $("b", null, nameOf(top.agent) + "’s " + kind), top.chain.length > 1 ? " unblocks the longest chain." : top.agent.ask?.blocking && !real ? " comes first: nothing waits behind any ask, and it is blocking." : " comes first: it has waited longest.");
          const ch = $("span", "chain"); top.chain.forEach((c, i) => { if (i) ch.append($("i", null, "→")); ch.append(nameOf(c)); }); ch.append($("i", null, "→"), "you");
          sub.append(ch);
          if (A.estimates && isFinite(top.workAfter)) sub.append($("span", null, "· then " + fmt(top.workAfter) + " of agent work until " + nameOf(top.chain[0]) + " finishes"));
          else sub.append($("span", null, "· waiting " + ago(field, top.agent.ask?.askedAt ?? top.agent.updatedAt)));
          const go = $("button", "btn small warm", "Show the ask"); go.type = "button";
          go.onclick = () => { view.flash = top.agent.id; const el = stage.querySelector(`.cp-ask[data-for="${top.agent.id}"]`); el?.scrollIntoView({block: "center", behavior: reduced ? "auto" : "smooth"}); el?.classList.remove("flash"); void el?.offsetWidth; el?.classList.add("flash"); hover(top.agent.id); setTimeout(() => { view.flash = null; hover(null); }, 1400); };
          sub.append(go);
        }
      } else {
        const latest = [...A.teams.values()].filter(t => t.cp).sort((x, y) => y.finish - x.finish)[0];
        hl.append($("b", "calm", "Nothing is waiting on you. "));
        if (latest && A.estimates) {
          hl.append("The last outcome to land is ", $("b", null, nameOf(latest.root)), ", in about " + fmt(latest.finish).replace("~", "") + ".");
          const ch = $("span", "chain"); latest.cp.path.forEach((id, i) => { if (i) ch.append($("i", null, "→")); ch.append(id.startsWith("ext:") ? A.g.nodes.get(id).label : nameOf(field.byId(id))); }); sub.append(ch);
        }
      }
      head.append(hl, sub); stage.append(head);
      if (!snapshot) { const h = $("p", "cp-hint"); h.append("Simulated field. Run ", $("code", null, "python3 docs/agent-display-mockups/export-threads.py"), " and reload to see your real records."); stage.append(h); }

      /* Mode and legend. */
      const tools = $("div", "cp-tools"), seg = $("div", "cp-seg");
      for (const [m, l] of [["critical", "Critical paths"], ["all", "Every wait"]]) { const b = $("button", "btn small", l); b.type = "button"; b.setAttribute("aria-pressed", String(view.mode === m)); b.onclick = () => { view.mode = m; field.emit(); }; seg.append(b); }
      const legend = $("div", "cp-legend");
      const sw = (cls, label, color) => { const s = $("span"); s.innerHTML = `<svg viewBox="0 0 22 10"><path d="M1 5H21" fill="none" stroke="${color}" stroke-width="${cls.includes("crit") ? 2.2 : 1.4}" ${cls.includes("dash") ? 'stroke-dasharray="5 4"' : cls.includes("dot") ? 'stroke-dasharray="1.5 3.5" stroke-linecap="round"' : ""}/></svg>`; s.append(label); return s; };
      const dot = (cls, label) => { const s = $("span"); s.innerHTML = `<svg viewBox="0 0 22 10"><circle cx="11" cy="5" r="3.6" ${cls === "open" ? 'fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"' : `fill="var(--${cls})"`}/></svg>`; s.append(label); return s; };
      legend.append(sw("crit", "critical path", "var(--accent)"), sw("crit", "stalled on you", "var(--warm)"), sw("", real ? "waits on child" : "waits on", "var(--line-strong)"), sw("dash", "reply owed", "var(--line-strong)"), sw("dot", "result owed", "var(--line-strong)"),
        dot("accent", "message"), dot("warm", "blocker / you"), dot("ok", "handoff"), dot("open", "awaiting reply"));
      tools.append(seg, legend); stage.append(tools);
      stage.append(replayBar(field));

      /* Teams: those that wait on you first (by ask rank), then those still moving (latest finish first), then settled. */
      const blocks = [];
      for (const t of A.teams.values()) {
        if (!t.cp && !t.live.length) continue;
        const you = t.finish === Infinity || t.live.some(a => A.g.reachesUser(a.id));
        const busy = t.live.some(a => ["working", "blocked", "waiting", "failed"].includes(a.status)) || you;
        if (!busy) continue;
        const expanded = all || view.expanded.has(t.root.id);
        const ids = laneNodes(field, A, t, expanded);
        if (!ids.size) ids.add(t.root.status !== "done" ? t.root.id : t.live[0].id);
        const hidden = t.live.filter(a => !ids.has(a.id)).length;
        const asks = A.holders.filter(h => h.root === t.root.id);
        blocks.push({t, you, ids, hidden, asks, expanded});
      }
      const settled = [...A.teams.values()].filter(t => !blocks.some(l => l.t === t));
      const rankOf = l => Math.min(...l.asks.map(h => h.rank), 999);
      blocks.sort((x, y) => Number(y.you) - Number(x.you) || rankOf(x) - rankOf(y) || y.t.finish - x.t.finish || y.t.live.length - x.t.live.length);

      // Rows are computed over what is shown, so a hidden branch does not push a node further down.
      const shown = new Set(blocks.flatMap(l => [...l.ids])), lv = new Map(), on = new Set();
      const levelOf = id => {
        if (lv.has(id)) return lv.get(id); if (on.has(id)) return 0; on.add(id);
        const ds = A.g.deps(id).filter(e => !e.back && shown.has(e.to));
        const L = ds.length ? 1 + Math.max(...ds.map(e => levelOf(e.to))) : 0;
        on.delete(id); lv.set(id, L); return L;
      };
      for (const id of shown) levelOf(id);

      const board = $("div", "cp-board");
      let section = null;
      for (const l of blocks) {
        const key2 = l.you ? "you" : "moving";
        if (section !== key2) {
          section = key2;
          const s = $("div", "cp-section", key2 === "you" ? "Waiting on you" : "Moving without you");
          s.append($("small", null, key2 === "you" ? "outcome on top · what it waits on below · you at the bottom" : A.estimates ? "latest finish first" : "most members first"));
          board.append(s);
        }
        const compact = (!l.you && !l.expanded && (large || field.scale === "medium")) || (large && l.ids.size > 6);
        const team = $("section", "cp-team " + key2); team.dataset.team = l.t.root.id;
        const th = $("div", "cp-team-head"); th.dataset.teamHead = l.t.root.id;
        const nb = $("button", "cp-team-name"); nb.type = "button"; nb.append(AgentField.statusDot(l.t.root), $("span", null, nameOf(l.t.root))); nb.title = l.t.root.title + " · open thread"; nb.onclick = () => api.select(l.t.root.id);
        const eta = l.t.finish === Infinity ? $("span", "cp-eta you", "stalled on you") : l.t.ext ? $("span", "cp-eta ext", "waits on " + l.t.ext) : $("span", "cp-eta", A.estimates ? "lands " + fmt(l.t.finish) : (l.t.cp?.path.length || 1) + (l.t.cp?.path.length === 1 ? " agent deep" : " agents deep"));
        if (l.t.finish === Infinity && A.estimates && isFinite(l.t.after)) eta.title = "Once you answer: about " + fmt(l.t.after).replace("~", "") + " of agent work";
        const meta = $("div", "cp-team-meta");
        if (l.t.done) meta.append($("span", null, "✓ " + l.t.done + " done"));
        if (!all && (l.hidden || view.expanded.has(l.t.root.id))) {
          const more = $("button", "btn quiet small", view.expanded.has(l.t.root.id) ? "only the path" : "+" + l.hidden + " off the path"); more.type = "button";
          more.onclick = () => { view.expanded.has(l.t.root.id) ? view.expanded.delete(l.t.root.id) : view.expanded.add(l.t.root.id); field.emit(); };
          meta.append(more);
        } else if (all && l.hidden) meta.append($("span", null, l.hidden + " idle"));
        th.append(nb, eta); if (meta.childNodes.length) th.append(meta);
        team.append(th);
        // Rows from the outcome (deepest level) down to the work being done.
        const byLevel = new Map(); let maxL = 0;
        for (const id of l.ids) { const L = lv.get(id) ?? 0; maxL = Math.max(maxL, L); if (!byLevel.has(L)) byLevel.set(L, []); byLevel.get(L).push(id); }
        const rows = $("div", "cp-rows"), pos = new Map();
        for (let L = maxL; L >= 0; L--) {
          const list = byLevel.get(L); if (!list) continue;
          // Order under the agents that wait on them to keep edges short.
          const bary = id => { const ws = A.g.waiters(id).filter(e => pos.has(e.from)).map(e => pos.get(e.from)); return ws.length ? ws.reduce((s, x) => s + x, 0) / ws.length : 999; };
          list.sort((x, y) => bary(x) - bary(y) || Number(A.crit.has(y)) - Number(A.crit.has(x)) || Number(A.g.reachesUser(y)) - Number(A.g.reachesUser(x)) || x.localeCompare(y));
          const row = $("div", "cp-row");
          list.forEach((id, i) => {
            pos.set(id, i / Math.max(1, list.length - 1));
            if (id.startsWith("ext:")) { const n = A.g.nodes.get(id); const e = $("div", "cp-ext" + (A.crit.has(id) ? " crit" : "")); e.dataset.id = id; e.title = "Outside the field: " + n.label; e.append("⧗ ", $("span", null, n.label)); row.append(e); return; }
            row.append(nodeEl(field, A, field.byId(id), {compact, fade: !A.crit.has(id) && !A.g.reachesUser(id)}));
          });
          rows.append(row);
        }
        team.append(rows);
        if (l.asks.length) {
          const you = $("div", "cp-you"), h4 = $("h4", null, "You");
          h4.append($("small", null, l.asks.length === 1 ? "1 answer needed" : l.asks.length + " answers needed"));
          const cards = $("div", "cp-you-cards");
          for (const h of l.asks) cards.append(askEl(field, A, h, large && h.rank > 3));
          you.append(h4, cards); team.append(you);
        }
        board.append(team);
      }
      if (!blocks.length) board.append($("div", "cp-section", "No outcome has work in flight."));
      const svg = document.createElementNS(NS, "svg"); svg.classList.add("cp-edges");
      board.prepend(svg);
      stage.append(board);

      if (settled.length) {
        const s = $("div", "cp-settled"), cap = large ? 30 : 40; s.append($("h4", null, "Settled"));
        for (const t of settled.slice(0, cap)) { const b = $("button", "btn quiet small"); b.type = "button"; b.dataset.settled = t.root.id; b.append(AgentField.statusDot(t.root), nameOf(t.root)); b.title = t.root.title + " · " + field.statusLabel(t.root); b.onclick = () => api.select(t.root.id); s.append(b); }
        if (settled.length > cap) s.append($("span", null, "+" + (settled.length - cap) + " more"));
        stage.append(s);
      }

      current = {board, A, field};
      drawEdges(field, A, board, svg);
      flip(board);
      liveMessages(field);
      if (view.hover) hover(view.hover);
    },
  });
})();
</script>
</body>
