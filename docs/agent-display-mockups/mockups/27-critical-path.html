<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 27 · Critical path</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    /* The user as a node in the dependency graph. Columns run from blocked (left) to unblocking (right);
       the right edge is You. One lane per team; the chain that finishes last is drawn, the rest fades. */
    .cp-head { display: grid; gap: 6px; max-width: 980px; margin-bottom: 16px; }
    .cp-headline { font-size: 19px; line-height: 1.4; letter-spacing: -.02em; font-weight: 450; }
    .cp-headline b { font-weight: 650; }
    .cp-headline .you { color: var(--warm); }
    .cp-headline .calm { color: var(--ok); }
    .cp-sub { font-size: 13px; color: var(--muted); line-height: 1.5; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
    .cp-sub .chain { color: var(--ink); }
    .cp-sub .chain i { font-style: normal; color: var(--muted); margin: 0 3px; }
    .cp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 4px 0 14px; font-size: 11px; color: var(--muted); }
    .cp-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .cp-seg .btn { border: 0; border-radius: 0; }
    .cp-seg .btn + .btn { border-left: 1px solid var(--line); }
    .cp-legend { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
    .cp-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cp-legend svg { width: 26px; height: 8px; overflow: visible; }

    .cp-scroll { overflow-x: auto; padding-bottom: 8px; }
    .cp-board { position: relative; display: grid; column-gap: 34px; row-gap: 0; min-width: 100%; }
    .cp-colhead { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 8px; border-bottom: 1px solid var(--line); align-self: end; }
    .cp-colhead.axis { display: flex; justify-content: space-between; }
    .cp-colhead.rail { color: var(--warm); background: color-mix(in srgb, var(--warm-tint) 70%, var(--paper)); padding: 10px 12px 8px; border-radius: 9px 9px 0 0; border-bottom-color: color-mix(in srgb, var(--warm) 30%, var(--line)); position: sticky; right: 0; z-index: 3; font-size: 11px; letter-spacing: .1em; }
    .cp-section { grid-column: 1 / -1; font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 18px 0 6px; display: flex; gap: 10px; align-items: baseline; }
    .cp-section small { font: 11px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; text-transform: none; }
    .cp-cell { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .cp-cell.rail { position: sticky; right: 0; z-index: 3; padding: 10px 10px; background: color-mix(in srgb, var(--warm-tint) 70%, var(--paper)); border-bottom-color: color-mix(in srgb, var(--warm) 22%, var(--line)); }
    .cp-cell.rail.last { border-radius: 0 0 9px 9px; }
    .cp-cell.rail.empty { background: color-mix(in srgb, var(--warm-tint) 30%, var(--paper)); }
    .cp-cell.label { justify-content: center; gap: 4px; padding-right: 4px; }
    .cp-lane-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: -.01em; min-width: 0; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; }
    .cp-lane-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-lane-name:hover span { text-decoration: underline; text-underline-offset: 2px; }
    .cp-lane-eta { font: 11px var(--mono); color: var(--muted); }
    .cp-lane-eta.you { color: var(--warm); font-weight: 600; }
    .cp-lane-eta.ext { color: var(--ink); }
    .cp-lane-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 10px; color: var(--muted); align-items: center; }
    .cp-lane-meta .btn { padding: 1px 6px; font-size: 10px; }

    /* Nodes: identity, surface, health and the estimate. */
    .cp-node { position: relative; z-index: 2; display: grid; gap: 3px; width: 100%; max-width: 230px; padding: 7px 9px 7px; text-align: left; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; font-size: 11px; line-height: 1.35; transition: opacity .2s, border-color .15s, box-shadow .15s; }
    .cp-node:hover, .cp-node:focus-visible { border-color: var(--hover-line); box-shadow: 0 4px 14px var(--shadow); }
    .cp-node.crit { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
    .cp-node.crit.stalled { border-color: color-mix(in srgb, var(--warm) 60%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warm) 22%, transparent); }
    .cp-node.needs { border-left: 3px solid var(--warm); }
    .cp-node.fade { opacity: .42; }
    .cp-node.fade:hover { opacity: 1; }
    .cp-node .id { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .cp-node .id .provider-logo { width: 12px; height: 12px; }
    .cp-node .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 12px; letter-spacing: -.01em; }
    .cp-node .nm.is-title { font-weight: 500; text-decoration: underline dotted color-mix(in srgb, var(--muted) 60%, transparent); text-underline-offset: 3px; }
    .cp-node .role { margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; color: var(--muted); }
    .cp-node .act + .role { display: none; }
    .cp-node .on { display: flex; gap: 5px; align-items: baseline; min-width: 0; color: var(--ink); }
    .cp-node .on .k { flex: none; font: 600 8.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .cp-node .on .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .cp-node .on .v.mono { font-size: 10px; color: var(--muted); }
    .cp-node .st { display: flex; gap: 6px; align-items: center; font-size: 10px; color: var(--muted); min-width: 0; overflow: hidden; }
    .cp-node .st .eta { font-family: var(--mono); color: var(--ink); white-space: nowrap; }
    .cp-node .st .eta.you { color: var(--warm); font-weight: 600; }
    .cp-node .st .chip { padding: 0 5px; font-size: 9px; line-height: 1.45; }
    .cp-node .st .chip.slip { color: var(--ink); border-style: dashed; }
    .cp-node .st .act { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--accent); }
    .cp-node.compact { padding: 5px 8px; gap: 2px; }
    .cp-node.compact .nm { font-size: 11px; }
    .cp-node.arrive { animation: cp-arrive .9s ease-out; }
    @keyframes cp-arrive { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
    .cp-ext { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; max-width: 200px; padding: 4px 9px; border: 1px dashed var(--line-strong); border-radius: 12px; font-size: 10px; color: var(--muted); background: var(--paper); }
    .cp-ext span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-ext.crit { border-color: var(--accent); color: var(--ink); }

    /* The You rail: each lane's asks, aligned with the agents that wait on them. */
    .cp-ask { position: relative; display: grid; gap: 4px; }
    .cp-ask .path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
    .cp-ask .path b { color: var(--ink); font-weight: 600; cursor: pointer; }
    .cp-ask .path b:hover { text-decoration: underline; }
    .cp-ask .path .you { color: var(--warm); font-weight: 700; }
    .cp-ask .rank { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--warm); color: var(--surface); font: 700 10px var(--mono); margin-right: 3px; }
    :root[data-theme="dark"] .cp-ask .rank { color: var(--paper); }
    .cp-ask .rank.first { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warm) 25%, transparent); }
    .cp-ask .unblocks { font-size: 10px; color: var(--muted); line-height: 1.4; }
    .cp-ask .unblocks b { color: var(--ink); font-weight: 600; }
    .cp-ask .ask { padding: 8px 10px; font-size: 11.5px; line-height: 1.45; }
    .cp-ask .ask .ask-impact { display: none; }
    .cp-ask .ask .ask-options { margin-top: 6px; gap: 5px; }
    .cp-ask .ask > .btn.quiet { padding: 2px 0 0; }
    .cp-ask.compact .ask-question { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cp-ask.compact .ask > .btn.quiet { display: none; }
    .cp-ask.flash .ask { animation: cp-flash 1.2s ease-out; }
    @keyframes cp-flash { 0%, 40% { box-shadow: 0 0 0 3px var(--warm); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .cp-next { font-size: 11px; line-height: 1.45; border-left: 3px solid var(--warm); padding: 6px 9px; border-radius: 5px; background: var(--surface); }
    .cp-next b { color: var(--warm); font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; display: block; }
    .cp-free { font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0; }

    /* Edges */
    .cp-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
    .cp-edges path.e { fill: none; stroke: var(--line-strong); stroke-width: 1.2; opacity: .7; }
    .cp-edges path.e.reply { stroke-dasharray: 5 4; }
    .cp-edges path.e.handoff { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
    .cp-edges path.e.external { stroke-dasharray: 2 3; }
    .cp-edges path.e.you { stroke: color-mix(in srgb, var(--warm) 55%, var(--line-strong)); }
    .cp-edges path.e.back { opacity: .35; }
    .cp-edges path.e.crit { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
    .cp-edges path.e.crit.you, .cp-edges path.e.crit.stalled { stroke: var(--warm); }
    .cp-edges text { font: 9.5px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
    .cp-edges text.crit { fill: var(--ink); }
    .cp-edges text.you { fill: var(--warm); font-weight: 600; }
    .cp-edges .flight { fill: var(--accent); }
    .cp-edges .flight.you { fill: var(--warm); }
    .cp-board.hovering .cp-node:not(.hl), .cp-board.hovering .cp-ext:not(.hl) { opacity: .25; }
    .cp-board.hovering .cp-ask:not(.hl) { opacity: .5; }
    .cp-board.hovering path.e:not(.hl), .cp-board.hovering .cp-edges text:not(.hl) { opacity: .08; }
    .cp-board.hovering path.e.hl { opacity: 1; stroke-width: 2.2; }
    .cp-board.hovering .cp-node.hl { opacity: 1; }
    .cp-edges marker path { fill: var(--line-strong); }
    .cp-edges marker.crit path { fill: var(--accent); }
    .cp-edges marker.warm path { fill: var(--warm); }

    .cp-settled { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 18px; font-size: 11px; color: var(--muted); }
    .cp-settled .btn { display: inline-flex; align-items: center; gap: 6px; }
    .cp-settled h4 { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
    @media (prefers-reduced-motion: reduce) { .cp-node, .cp-node.arrive, .cp-ask.flash .ask { animation: none; transition: none; } }
  </style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/fixture.js"></script>
<script src="../shared/orchestration.js"></script>
<script src="../shared/mockup.js"></script>
<script>
"use strict";
(() => {
  const $ = AgentField.el, MIN = 60_000, EXT_MIN = 15;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // View state that survives re-renders.
  const view = {mode: null, expanded: new Set(), hover: null, focus: null, seenMsg: null, rects: new Map(), lastScale: null, flash: null};

  const nameOf = a => a.name || a.title;
  const fmt = m => m === Infinity ? "stalled on you" : m < 1 ? "<1m" : m < 60 ? "~" + Math.round(m) + "m" : "~" + Math.floor(m / 60) + "h " + String(Math.round(m % 60)).padStart(2, "0") + "m";
  const ago = (field, t) => field.duration(Math.max(0, field.now - t));
  const ROLE_SHORT = {orchestrator: "orchestrator", implementer: "implementer", reviewer: "reviewer", researcher: "researcher", releaser: "releaser", dispatcher: "dispatcher", subagent: "subagent", delegate: "delegate"};

  /* The dependency graph. An edge waiter → dependency comes from four places:
       waitingOn (proposed; agent or external), an ask or next_actor=user (→ You),
       an open reply_required request (today: the sender waits on the recipient's reply),
       and an unanswered creation (today: the creator waits on the child's handoff). */
  function buildGraph(field) {
    const out = new Map(), into = new Map(), nodes = new Map();
    const node = (id, extra) => { if (!nodes.has(id)) nodes.set(id, {id, ...extra}); return nodes.get(id); };
    const live = a => a && a.status !== "done";
    const add = (from, to, kind, since, msg) => {
      if (from === to) return;
      if (!out.has(from)) out.set(from, new Map());
      const m = out.get(from); let e = m.get(to);
      if (!e) { e = {from, to, kinds: new Set(), since, msgs: []}; m.set(to, e); if (!into.has(to)) into.set(to, []); into.get(to).push(e); }
      e.kinds.add(kind); e.since = Math.min(e.since, since); if (msg) e.msgs.push(msg);
    };
    node("user", {type: "user"});
    for (const a of field.agents) {
      if (!live(a)) continue;
      node(a.id, {type: "agent", agent: a});
      for (const w of a.waitingOn) {
        if (w.startsWith("external:")) { const id = "ext:" + a.id + ":" + w.slice(9); node(id, {type: "ext", label: w.slice(9), owner: a.id}); add(a.id, id, "external", a.updatedAt); }
        else if (live(field.byId(w))) add(a.id, w, "waits", a.updatedAt);
      }
      if (field.needsUser(a)) add(a.id, "user", a.ask ? "ask" : "next", a.ask?.askedAt ?? a.updatedAt);
    }
    for (const m of field.openRequests()) {
      if (m.from === "user") continue;
      const from = field.byId(m.from); if (!live(from)) continue;
      if (m.to === "user") { add(m.from, "user", "request", m.at, m); continue; }
      if (!live(field.byId(m.to))) continue;
      add(m.from, m.to, m.kind === "creation" ? "handoff" : "reply", m.at, m);
    }
    const deps = id => [...(out.get(id)?.values() || [])];
    const waiters = id => into.get(id) || [];

    // Levels: sinks (working agents, externals) are 0, You is -1, everyone else is 1 + their deepest dependency.
    // A request that closes a loop is kept as a back edge and drawn faintly; it does not set the level.
    const level = new Map([["user", -1]]), state = new Map();
    const visit = id => {
      if (level.has(id) && state.get(id) !== 1) return level.get(id);
      state.set(id, 1); let L = 0, any = false;
      for (const e of deps(id)) {
        if (state.get(e.to) === 1) { e.back = true; continue; }
        any = true; L = Math.max(L, visit(e.to) + 1);
      }
      if (!any) L = 0;
      // An agent whose only dependency is You sits next to the rail.
      if (any && deps(id).every(e => e.to === "user" || e.back)) L = 0;
      state.set(id, 2); level.set(id, L); return L;
    };
    // Visit from the roots first so loops break at the most recent request, not at the delegation.
    const order = [...nodes.keys()].filter(id => id !== "user").sort((x, y) => (field.byId(x) ? field.depth(x) : 9) - (field.byId(y) ? field.depth(y) : 9));
    for (const id of order) visit(id);

    // Estimates: own remaining work from plan progress and pace; finish = own + latest dependency.
    const own = a => {
      // Delegated steps are counted through the child's own finish, so only the agent's own steps count here.
      const p = field.progress(a), elapsed = Math.max(1, (field.now - a.createdAt) / MIN);
      const pace = p.done ? Math.min(20, Math.max(4, elapsed / p.done)) : 12;
      const left = Math.max(1, a.plan.filter(s => s.state !== "done" && s.state !== "delegated").length);
      return a.status === "working" ? left * pace : left * pace * .5;
    };
    const finishWith = userMin => {
      const memo = new Map();
      const f = id => {
        if (id === "user") return userMin;
        if (memo.has(id)) return memo.get(id);
        memo.set(id, 0);
        const n = nodes.get(id); let v;
        if (n.type === "ext") v = EXT_MIN;
        else { let d = 0; for (const e of deps(id)) if (!e.back) d = Math.max(d, f(e.to)); v = own(n.agent) + d; }
        memo.set(id, v); return v;
      };
      return f;
    };
    const finish = finishWith(Infinity), after = finishWith(0);

    // Who you block: every agent that reaches You through any chain.
    const reach = new Map();
    const reachesUser = id => {
      if (id === "user") return true; if (reach.has(id)) return reach.get(id);
      reach.set(id, false); const r = deps(id).some(e => !e.back && reachesUser(e.to)); reach.set(id, r); return r;
    };
    for (const id of nodes.keys()) reachesUser(id);

    // Longest chain of waiters behind an agent (upstream), for ranking asks.
    const upMemo = new Map();
    const up = id => {
      if (upMemo.has(id)) return upMemo.get(id);
      upMemo.set(id, {len: 1, path: [id]});
      let best = {len: 1, path: [id]};
      for (const e of waiters(id)) { if (e.back) continue; const u = up(e.from); if (u.len + 1 > best.len) best = {len: u.len + 1, path: [...u.path, id]}; }
      upMemo.set(id, best); return best;
    };
    const upstream = id => { const seen = new Set(), stack = [id]; while (stack.length) { const x = stack.pop(); for (const e of waiters(x)) if (!e.back && !seen.has(e.from)) { seen.add(e.from); stack.push(e.from); } } return seen; };

    return {nodes, out, deps, waiters, level, finish, after, reachesUser: id => reach.get(id), up, upstream};
  }

  // The chain that finishes last: from a root, always follow the dependency with the latest finish.
  function criticalPath(g, rootId) {
    const path = [rootId], edges = [];
    let cur = rootId; const seen = new Set([rootId]);
    while (true) {
      const ds = g.deps(cur).filter(e => !e.back && !seen.has(e.to));
      if (!ds.length) break;
      ds.sort((x, y) => g.finish(y.to) - g.finish(x.to) || g.after(y.to) - g.after(x.to));
      const e = ds[0]; edges.push(e); path.push(e.to); seen.add(e.to);
      if (e.to === "user" || e.to.startsWith("ext:")) break;
      cur = e.to;
    }
    return {path, edges};
  }

  function analyse(field) {
    const g = buildGraph(field);
    const teamOf = id => { if (id === "user") return null; if (id.startsWith("ext:")) return teamOf(g.nodes.get(id).owner); return field.ancestors(id).at(-1)?.id || id; };
    const crit = new Set(), critEdges = new Set(), stalledNodes = new Set();
    const teams = new Map();
    for (const r of field.roots()) {
      const members = [r, ...field.descendants(r.id)];
      const liveMembers = members.filter(a => a.status !== "done");
      const t = {root: r, members, live: liveMembers, done: members.length - liveMembers.length, cp: null, finish: 0, needs: members.filter(field.needsUser), ext: null};
      teams.set(r.id, t);
      if (r.status === "done" && !liveMembers.length) continue;
      // The outcome is the root; if the root is done but members still run, take the latest of them.
      const start = r.status !== "done" ? r.id : liveMembers.sort((x, y) => g.finish(y.id) - g.finish(x.id))[0]?.id;
      if (!start) continue;
      t.cp = criticalPath(g, start); t.finish = g.finish(start); t.after = g.after(start);
      const tail = t.cp.path.at(-1); if (tail.startsWith("ext:")) t.ext = g.nodes.get(tail).label;
      for (const id of t.cp.path) { crit.add(id); if (t.finish === Infinity) stalledNodes.add(id); }
      for (const e of t.cp.edges) critEdges.add(e);
    }
    // Asks, ranked: the longest chain of waiters first, then how many agents it holds up, then blocking, then age.
    const holders = field.agents.filter(a => a.status !== "done" && field.needsUser(a)).map(a => {
      const u = g.up(a.id), blocked = g.upstream(a.id), root = teamOf(a.id);
      return {agent: a, chain: u.path.map(field.byId).filter(Boolean), blocked: [...blocked].map(field.byId).filter(Boolean), root, workAfter: g.after(u.path[0])};
    }).sort((x, y) => y.chain.length - x.chain.length || y.blocked.length - x.blocked.length || Number(!!y.agent.ask?.blocking) - Number(!!x.agent.ask?.blocking) || (x.agent.ask?.askedAt ?? x.agent.updatedAt) - (y.agent.ask?.askedAt ?? y.agent.updatedAt));
    holders.forEach((h, i) => { h.rank = i + 1; });
    const blockedByYou = field.agents.filter(a => a.status !== "done" && g.reachesUser(a.id));
    const blockedTeams = new Set(blockedByYou.map(a => teamOf(a.id)));
    return {g, teamOf, crit, critEdges, stalledNodes, teams, holders, blockedByYou, blockedTeams};
  }

  /* Which nodes a lane shows. Critical mode: the critical path, everyone who reaches You, and anything on
     another team's path that lives here. All mode (or an expanded lane): every unfinished member with an edge. */
  function laneNodes(field, A, t, all) {
    const ids = new Set();
    for (const a of t.live) {
      const id = a.id, hasEdge = A.g.deps(id).length || A.g.waiters(id).length;
      if (A.crit.has(id) || A.g.reachesUser(id) || (all && (hasEdge || a === t.root))) ids.add(id);
      for (const e of A.g.deps(id)) if (e.to.startsWith("ext:") && (ids.has(id) && (all || A.crit.has(e.to)))) ids.add(e.to);
    }
    return ids;
  }

  function nodeEl(field, A, a, {compact, fade}) {
    const b = $("button", "cp-node"); b.type = "button"; b.dataset.id = a.id;
    const stalled = A.stalledNodes.has(a.id);

  /* Edges are measured from the laid-out DOM. Only edges between visible nodes are drawn; in critical mode

  // Reflow: nodes glide from where they were to their new column (FLIP), so answering visibly moves the graph.
  function flip(board) {
    if (reduced || !view.rects.size) return;
    const br = board.getBoundingClientRect(); let moved = false;
    for (const el of board.querySelectorAll("[data-id]")) {
      const old = view.rects.get(el.dataset.id); if (!old) continue;

      if (Math.abs(dx) < 2 && Math.abs(dy) < 2) continue;
      moved = true;
      el.animate([{transform: `translate(${dx}px, ${dy}px)`}, {transform: "none"}], {duration: 420, easing: "cubic-bezier(.2,.7,.2,1)"});
    }
    if (moved) board.querySelector(".cp-edges")?.animate([{opacity: 0}, {opacity: 0}, {opacity: 1}], {duration: 520});
  }

  // Messages in flight: a dot travels from sender to recipient for messages that arrived since the last render.
  function flights(field, A, board, svg) {
    const last = field.messages.at(-1)?.id || 0;
    if (view.seenMsg === null) { view.seenMsg = last; return; }
    const fresh = field.messages.filter(m => m.id > view.seenMsg); view.seenMsg = last;
    if (reduced || !fresh.length) return;
    const br = board.getBoundingClientRect(), NS = "http://www.w3.org/2000/svg";
    const at = (id, forAsk) => { const el = id === "user" ? board.querySelector(`.cp-ask[data-for="${forAsk}"]`) || board.querySelector(".cp-colhead.rail") : board.querySelector(`[data-id="${id}"]`); if (!el) return null; const r = el.getBoundingClientRect(); return {el, x: r.left - br.left + r.width / 2, y: r.top - br.top + r.height / 2}; };
    for (const m of fresh.slice(-8)) {
      const a = at(m.from, m.to), b = at(m.to, m.from); if (!a || !b) continue;
      const c = document.createElementNS(NS, "circle"); c.setAttribute("r", "4"); c.setAttribute("class", "flight" + (m.to === "user" || m.from === "user" ? " you" : ""));
      svg.append(c);
      c.animate([{transform: `translate(${a.x}px, ${a.y}px)`}, {transform: `translate(${b.x}px, ${b.y}px)`}], {duration: 850, easing: "ease-in-out", fill: "forwards"}).onfinish = () => c.remove();
      if (b.el.classList.contains("cp-node")) setTimeout(() => { b.el.classList.remove("arrive"); void b.el.offsetWidth; b.el.classList.add("arrive"); }, 800);
    }
  }
})();
</script>
