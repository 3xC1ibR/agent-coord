<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ribbon Field — A team that remembers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" aria-label="Animated illustration of the Ribbon Field dispatcher workflow">
  <div id="brand"><img src="assets/ribbon-field.png" alt=""><span>Ribbon Field</span></div>
  <h1 id="headline"></h1>
  <div id="story">
    <div id="request"><span class="quote">“</span><span id="request-text"></span><span class="quote">”</span></div>
    <svg id="network" viewBox="0 0 1080 1080" aria-hidden="true">
      <path id="input-link" d="M540 405 V461"/><circle id="input-packet" cx="540" cy="405" r="4.5"/>
      <g id="links"></g><g id="packets"></g>
    </svg>
    <div id="hub"><span class="hub-mark"><svg viewBox="0 0 40 40"><path d="M20 5v11m0 0L7 28m13-12 13 12M7 28v7m13-19v19m13-7v7"/><circle cx="20" cy="5" r="3"/><circle cx="7" cy="35" r="3"/><circle cx="20" cy="35" r="3"/><circle cx="33" cy="35" r="3"/></svg></span><span class="hub-label">Your dispatcher</span></div>
    <div class="agent" id="chat" style="--tone:#3f7062;--tint:#e4eee8">
      <div class="orb"><svg class="orbit" viewBox="0 0 144 144"><circle class="orbit-track" cx="72" cy="72" r="66"/><circle class="orbit-progress" cx="72" cy="72" r="66"/></svg><div class="symbol"><svg viewBox="0 0 64 64"><path d="M12 14h40v28H28L16 51v-9h-4z"/><path d="M22 25h20M22 33h13"/></svg></div><span class="arrival"></span></div>
      <h2>Chat agent</h2><div class="memory"><span class="initial">Chat app</span><span class="revision">Dark theme</span></div><p class="status"></p>
    </div>
    <div class="agent" id="snake" style="--tone:#847099;--tint:#efebf4">
      <div class="orb"><svg class="orbit" viewBox="0 0 144 144"><circle class="orbit-track" cx="72" cy="72" r="66"/><circle class="orbit-progress" cx="72" cy="72" r="66"/></svg><div class="symbol"><svg viewBox="0 0 64 64"><path d="M15 45h25a8 8 0 0 0 0-16H25a8 8 0 0 1 0-16h22"/><path d="m41 7 7 6-7 6"/></svg></div><span class="arrival"></span></div>
      <h2>Snake agent</h2><div class="memory"><span class="initial">Snake game</span><span class="revision">Swipe controls</span></div><p class="status"></p>
    </div>
    <div class="agent" id="pong" style="--tone:#9c7949;--tint:#f1eadd">
      <div class="orb"><svg class="orbit" viewBox="0 0 144 144"><circle class="orbit-track" cx="72" cy="72" r="66"/><circle class="orbit-progress" cx="72" cy="72" r="66"/></svg><div class="symbol"><svg viewBox="0 0 64 64"><path d="M14 17v28M50 21v28"/><circle cx="32" cy="29" r="4"/></svg></div><span class="arrival"></span></div>
      <h2>Pong agent</h2><div class="memory"><span class="initial">Pong game</span><span class="revision">Rematch button</span></div><p class="status"></p>
    </div>
    <p id="explanation"></p>
  </div>
  <div id="endcard"><img src="assets/ribbon-field.png" alt="Ribbon Field app icon"><h2>Ribbon Field</h2><p class="end-promise">Start something.<br><span>Keep it moving.</span></p><p class="end-detail">New ideas get agents.<br>Follow-ups keep their context.</p></div>
  <p id="film-note">Workflow illustration · Activity condensed</p>
</main>
<script src="scenes.js"></script>
</body>
</html>
