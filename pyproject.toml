[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coord"
version = "0.1.0"
description = "Local coordination for Claude Code and Codex sessions"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "r", email = "hi@rquinonez.com" },
]

[project.scripts]
agent-coord = "agent_coord.cli:main"

[tool.setuptools]
package-dir = { "" = "plugins/agent-coord/scripts" }

[tool.setuptools.packages.find]
where = ["plugins/agent-coord/scripts"]
